<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Awareness — The Witness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#07080d; --surface:#0e0f17; --border:rgba(255,255,255,0.07);
    --text:#ddd8ce; --muted:rgba(221,216,206,0.38);
    --green:#7eb8a4; --green2:#a4c4b8; --green-soft:#c4e0d4; --green-dim:rgba(126,184,164,0.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:var(--bg); color:var(--text); font-family:'DM Mono',monospace; overflow-x:hidden; }
  body { display:flex; justify-content:center; }
  .frame { width:100%; max-width:430px; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; padding:0 16px; }

  @keyframes spin    { to { transform:rotate(360deg); } }
  @keyframes spinRev { to { transform:rotate(-360deg); } }
  @keyframes ripple  { 0%{ transform:scale(.55); opacity:.55; } 70%{ opacity:.12; } 100%{ transform:scale(1.25); opacity:0; } }
  @keyframes auraPulse { 0%,100%{ transform:translateY(-50%) scale(.9); opacity:.5; } 50%{ transform:translateY(-50%) scale(1.12); opacity:.9; } }
  @keyframes heroFloat { 0%,100%{ transform:translateY(0); opacity:.5; } 50%{ transform:translateY(-9px); opacity:1; } }
  @keyframes emblemPulse { 0%,100%{ filter:drop-shadow(0 0 5px rgba(196,224,212,.4)); } 50%{ filter:drop-shadow(0 0 11px rgba(196,224,212,.75)); } }

  .banner { position:relative; flex-shrink:0; height:142px; margin:14px 0 4px; border-radius:18px;
    background:linear-gradient(145deg,#0c1c18 0%,#0f2a24 45%,#0b1a18 100%); overflow:hidden;
    display:flex; align-items:center; padding:0 24px; }
  .banner::before { content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 60% 74% at 76% 52%, rgba(126,184,164,.22) 0%, transparent 70%); }
  .banner::after { content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 40% 50% at 72% 46%, rgba(180,230,210,.10) 0%, transparent 60%); }

  .banner-text { z-index:3; display:flex; flex-direction:column; gap:4px; }
  .banner-label { font-size:8px; letter-spacing:.28em; text-transform:uppercase; color:rgba(142,204,184,.78); }
  .banner-title { font-family:'Cormorant Garamond',serif; font-size:27px; font-weight:300; color:var(--green-soft); line-height:1.05; }
  .banner-sub   { font-size:9px; letter-spacing:.12em; color:rgba(196,224,212,.55); margin-top:2px; }
  .banner-sub b { color:rgba(196,224,212,.9); font-weight:500; }

  .banner-glow { position:absolute; right:6px; top:50%; width:180px; height:180px; transform:translateY(-50%);
    background:radial-gradient(circle, rgba(180,230,210,0.22) 0%, rgba(126,184,164,0.09) 42%, transparent 70%);
    pointer-events:none; animation:auraPulse 5s ease-in-out infinite; }

  .sigil-stack { position:absolute; right:18px; top:50%; transform:translateY(-50%); width:150px; height:150px; z-index:2; }
  .sigil { position:absolute; inset:0; }
  .sigil svg { width:100%; height:100%; display:block; }
  .sigil-outer { transform-origin:75px 75px; animation:spin 64s linear infinite; }
  /* expanding awareness ripples */
  .ripple { position:absolute; left:50%; top:50%; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%;
    border:1px solid rgba(164,196,184,.5); animation:ripple 5s ease-out infinite; }
  .ripple:nth-child(2){ animation-delay:1.6s; } .ripple:nth-child(3){ animation-delay:3.2s; }

  .rank-emblem { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:58px; height:58px; z-index:3;
    display:flex; align-items:center; justify-content:center; }
  .rank-ring { position:absolute; inset:0; }
  .rank-ring svg { width:100%; height:100%; transform:rotate(-90deg); }
  .rank-logo { position:relative; z-index:2; animation:emblemPulse 4s ease-in-out infinite; }

  .dots { position:absolute; inset:0; pointer-events:none; z-index:1; }
  .dots > i { position:absolute; border-radius:50%; background:rgba(180,230,210,.5); animation:heroFloat 4s ease-in-out infinite; }

  .body-area { flex:1; overflow-y:auto; padding:18px 4px 40px; display:flex; flex-direction:column; align-items:center; }
  .next { width:100%; border:1px solid var(--border); border-radius:14px; padding:16px 18px; background:var(--surface); margin-bottom:14px; }
  .next-row { display:flex; align-items:center; justify-content:space-between; }
  .next-key { font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .next-val { font-family:'Cormorant Garamond',serif; font-size:18px; color:var(--green2); }
  .next-div { height:1px; background:var(--border); margin:12px 0; }
  .begin { width:100%; max-width:320px; margin:8px auto 0; padding:16px; border-radius:12px; border:none; cursor:pointer;
    background:var(--green); color:#07080d; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.18em; text-transform:uppercase; }
  .ghost { width:100%; max-width:320px; margin:10px auto 0; padding:14px; border-radius:12px; cursor:pointer;
    background:none; border:1px solid var(--border); color:var(--muted); font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="frame">
    <div class="banner">
      <div class="banner-text">
        <div class="banner-label">The Witness</div>
        <div class="banner-title">Awareness</div>
        <div class="banner-sub">Level <b>23</b> · The Lotus</div>
      </div>
      <div class="banner-glow"></div>

      <div class="sigil-stack">
        <div class="ripple"></div><div class="ripple"></div><div class="ripple"></div>
        <div class="sigil">
          <svg viewBox="0 0 150 150">
            <g class="sigil-outer" fill="none" stroke="#7eb8a4" stroke-width="0.7" opacity="0.8">
              <circle cx="75" cy="75" r="70"/>
              <circle cx="75" cy="75" r="60" stroke-dasharray="2 6"/>
              <g stroke-width="1">
                <line x1="75" y1="5" x2="75" y2="12"/> <line x1="75" y1="138" x2="75" y2="145"/>
                <line x1="5" y1="75" x2="12" y2="75"/> <line x1="138" y1="75" x2="145" y2="75"/>
              </g>
            </g>
          </svg>
        </div>
        <div class="rank-emblem">
          <div class="rank-ring">
            <svg viewBox="0 0 58 58">
              <circle cx="29" cy="29" r="25" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
              <circle cx="29" cy="29" r="25" fill="none" stroke="#7eb8a4" stroke-width="2" stroke-linecap="round"
                      stroke-dasharray="157" stroke-dashoffset="40"/>
            </svg>
          </div>
          <div class="rank-logo">
            <!-- witness rank glyph: the open eye -->
            <svg width="30" height="30" viewBox="0 0 100 100" fill="none">
              <path d="M10 50 Q50 10 90 50 Q50 90 10 50Z" stroke="#c4e0d4" stroke-width="2.5" opacity="0.9"/>
              <circle cx="50" cy="50" r="14" stroke="#c4e0d4" stroke-width="2"/>
              <circle cx="50" cy="50" r="6" fill="#c4e0d4" opacity="0.9"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="dots">
        <i style="width:6px;height:6px;left:50%;top:30%;animation-delay:0s;"></i>
        <i style="width:4px;height:4px;left:40%;top:62%;animation-delay:1.2s;"></i>
        <i style="width:5px;height:5px;left:58%;top:70%;animation-delay:.6s;background:rgba(180,230,210,.35);"></i>
      </div>
    </div>

    <div class="body-area">
      <div class="next" style="max-width:360px;">
        <div class="next-row"><span class="next-key">session duration</span><span class="next-val">30 min</span></div>
        <div class="next-div"></div>
        <div class="next-row"><span class="next-key">reminder every</span><span class="next-val">2 min</span></div>
      </div>
      <button class="begin">Begin Session</button>
      <button class="ghost">View History</button>
    </div>
  </div>
</body>
</html>
