<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Awareness — The Witness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#07080d; --surface:#0e0f17; --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
    --text:#ddd8ce; --muted:rgba(221,216,206,0.38);
    --green:#7eb8a4; --green2:#a4c4b8; --green-soft:#c4e0d4;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:var(--bg); color:var(--text); font-family:'DM Mono',monospace; overflow:hidden; }
  body { display:flex; justify-content:center; }
  .frame { width:100%; max-width:430px; height:100vh; background:var(--bg); display:flex; flex-direction:column; padding:0 16px 22px; }

  @keyframes ripple    { 0%{ transform:scale(.5); opacity:.5; } 70%{ opacity:.1; } 100%{ transform:scale(1.3); opacity:0; } }
  @keyframes glowPulse { 0%,100%{ opacity:.5; } 50%{ opacity:1; } }
  @keyframes heroFloat { 0%,100%{ transform:translateY(0); opacity:.45; } 50%{ transform:translateY(-7px); opacity:.9; } }
  @keyframes eyePulse  { 0%,100%{ opacity:.6; } 50%{ opacity:1; } }
  @keyframes breathe   { 0%,100%{ transform:scale(.82); opacity:.28; } 50%{ transform:scale(1.18); opacity:.8; } }
  @keyframes breathRng { 0%,100%{ transform:scale(.9);  opacity:.35; } 50%{ transform:scale(1.07); opacity:.7; } }
  @keyframes ringGlow  { 0%,100%{ filter:drop-shadow(0 0 4px rgba(126,184,164,.4)); } 50%{ filter:drop-shadow(0 0 10px rgba(126,184,164,.75)); } }
  @keyframes symbolPls { 0%,100%{ opacity:.6; } 50%{ opacity:1; } }

  /* ── BANNER — rich green, mirrors path-banner recipe ── */
  .banner { position:relative; flex-shrink:0; height:148px; margin:14px 0 0; border-radius:18px; overflow:hidden;
    background:linear-gradient(145deg, #0c2a1e 0%, #113828 40%, #0c2218 100%);
    display:flex; align-items:center; justify-content:space-between; padding:0 22px; }
  .banner::before { content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 60% 70% at 72% 55%, rgba(80,210,150,.28) 0%, transparent 70%); }
  .banner::after  { content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 40% 50% at 68% 48%, rgba(160,255,210,.12) 0%, transparent 60%); }

  .banner-text { z-index:3; display:flex; flex-direction:column; gap:3px; }
  .banner-label { font-size:8px; letter-spacing:.28em; text-transform:uppercase; color:rgba(142,220,184,.78); }
  .banner-title { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:300; color:#d8fff4; line-height:1.1; }
  .banner-sub   { font-size:9px; letter-spacing:.1em; color:rgba(200,245,225,.48); margin-top:1px; }

  /* right — ripples + eye */
  .banner-right { position:relative; z-index:2; width:148px; height:148px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; }
  .banner-glow { position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle, rgba(126,220,180,0.22) 0%, rgba(126,184,164,0.08) 42%, transparent 70%);
    animation:glowPulse 5s ease-in-out infinite; }
  .ripple { position:absolute; left:50%; top:50%; border-radius:50%; border:1px solid rgba(164,210,184,.5);
    animation:ripple 5s ease-out infinite; }
  .ripple:nth-child(2){ width:110px; height:110px; margin:-55px 0 0 -55px; }
  .ripple:nth-child(3){ width:110px; height:110px; margin:-55px 0 0 -55px; animation-delay:1.7s; }
  .ripple:nth-child(4){ width:110px; height:110px; margin:-55px 0 0 -55px; animation-delay:3.4s; }
  .pause-mark { position:relative; z-index:3; animation:eyePulse 5s ease-in-out infinite; }
  .dots-bg { position:absolute; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
  .dots-bg > i { position:absolute; border-radius:50%; background:rgba(180,230,210,.48); animation:heroFloat 4.5s ease-in-out infinite; }

  /* (streak chip removed — streak lives in top nav bar) */

  /* ── BODY ── */
  .body { flex:1; display:flex; flex-direction:column; min-height:0; padding-top:8px; }
  .hero { display:flex; flex-direction:column; align-items:center; flex:1; justify-content:center; }

  /* ring with breathing aura — more saturated green */
  .ring-stack { position:relative; width:210px; height:210px; display:flex; align-items:center; justify-content:center; }
  .breath-aura { position:absolute; width:210px; height:210px; border-radius:50%;
    background:radial-gradient(circle, rgba(126,184,164,.30), transparent 64%); animation:breathe 8s ease-in-out infinite; }
  .breath-ring { position:absolute; width:176px; height:176px; border-radius:50%;
    border:1px solid rgba(126,184,164,.32); animation:breathRng 8s ease-in-out infinite; }
  .level-ring { position:relative; width:142px; height:142px; cursor:pointer; z-index:2; animation:ringGlow 5s ease-in-out infinite; }
  .level-ring svg { width:142px; height:142px; transform:rotate(-90deg); display:block; }
  .ring-track { fill:none; stroke:rgba(126,184,164,0.18); stroke-width:3; }
  .ring-prog  { fill:none; stroke:var(--green); stroke-width:3.5; stroke-linecap:round;
    stroke-dasharray:383; stroke-dashoffset:134; }
  .ring-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .ring-num { font-family:'Cormorant Garamond',serif; font-size:40px; font-weight:300; color:var(--text); line-height:1; }
  .ring-sub { font-size:8px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); }

  /* rank symbol + xp */
  .symbol-row { display:flex; align-items:center; gap:20px; margin-top:18px; }
  .rank-symbol { animation:symbolPls 5s ease-in-out infinite; }
  .xp-block { text-align:center; }
  .xp-val { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:300; color:#a4d4be; line-height:1; }
  .xp-key { font-size:8px; letter-spacing:.22em; text-transform:uppercase; color:rgba(126,184,164,.6); margin-top:3px; }

  /* ── CONTROLS ── */
  .controls-card { width:100%; border:1px solid rgba(126,184,164,.22); border-radius:16px; background:rgba(126,184,164,.04); padding:0 20px; flex-shrink:0; margin-top:14px; }
  .ctrl-row { display:flex; align-items:center; justify-content:space-between; padding:14px 0; }
  .ctrl-row + .ctrl-row { border-top:1px solid rgba(126,184,164,.12); }
  .ctrl-key { font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:rgba(126,184,164,.6); }
  .stepper { display:flex; align-items:center; gap:12px; }
  .step-btn { width:32px; height:32px; border-radius:50%; border:1px solid rgba(126,184,164,.38); background:rgba(126,184,164,.10);
    color:var(--green); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-family:'DM Mono',monospace; transition:background .15s; user-select:none; }
  .step-btn:active { background:rgba(126,184,164,.25); }
  .step-val { font-family:'Cormorant Garamond',serif; font-size:21px; color:#a4d4be; min-width:72px; text-align:center; }

  /* ── ACTIONS ── */
  .actions { margin-top:12px; display:flex; flex-direction:column; gap:9px; flex-shrink:0; }
  .btn { width:100%; padding:16px; border-radius:13px; cursor:pointer; font-family:'DM Mono',monospace;
    font-size:11px; letter-spacing:.18em; text-transform:uppercase; transition:opacity .15s; }
  .btn.primary { background:var(--green); color:#07080d; border:none; }
  .btn.primary:active { opacity:.85; }
  .btn.ghost { background:none; border:1px solid rgba(126,184,164,.22); color:rgba(126,184,164,.65); font-size:10px; }
</style>
</head>
<body>
<div class="frame">

  <!-- ════ BANNER ════ -->
  <div class="banner">
    <div class="banner-text">
      <div class="banner-label">The Witness</div>
      <div class="banner-title">Awareness</div>
      <div class="banner-sub">The Lotus · Level 23</div>
    </div>

    <div class="banner-right">
      <div class="banner-glow"></div>
      <div class="ripple"></div><div class="ripple"></div><div class="ripple"></div>
      <!-- Eckhart Tolle calligraphic pause/presence mark — elongated S-curve with endpoint dots -->
      <svg class="pause-mark" width="52" height="84" viewBox="0 0 52 84" fill="none">
        <path d="M 34 8 C 44 12 46 26 36 34 C 26 42 20 56 28 68 C 32 74 40 78 36 82"
              stroke="#c4e0d4" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="22" cy="16" r="3.8" fill="#c4e0d4" opacity="0.9"/>
        <circle cx="34" cy="75" r="3.8" fill="#c4e0d4" opacity="0.9"/>
      </svg>
    </div>

    <div class="dots-bg">
      <i style="width:5px;height:5px;left:28%;top:26%;animation-delay:.3s;"></i>
      <i style="width:4px;height:4px;left:34%;top:70%;animation-delay:1.8s;"></i>
      <i style="width:3px;height:3px;left:42%;top:50%;animation-delay:.9s;"></i>
    </div>
  </div>

  <!-- ════ BODY ════ -->
  <div class="body">
    <div class="hero">
      <div class="ring-stack">
        <div class="breath-aura"></div>
        <div class="breath-ring"></div>
        <div class="level-ring">
          <svg viewBox="0 0 142 142">
            <circle class="ring-track" cx="71" cy="71" r="61"/>
            <circle class="ring-prog"  cx="71" cy="71" r="61"/>
          </svg>
          <div class="ring-center">
            <div class="ring-num">23</div>
            <div class="ring-sub">Level</div>
          </div>
        </div>
      </div>

      <div class="symbol-row">
        <div class="rank-symbol">
          <svg width="44" height="44" viewBox="0 0 100 100" fill="none" stroke="#a4d4be" stroke-width="2">
            <path d="M50 80 Q30 60 30 45 Q30 25 50 30 Q70 25 70 45 Q70 60 50 80Z" opacity="0.9"/>
            <path d="M50 80 Q20 65 15 45 Q12 28 35 35" opacity="0.65"/>
            <path d="M50 80 Q80 65 85 45 Q88 28 65 35" opacity="0.65"/>
            <line x1="50" y1="80" x2="50" y2="94" opacity="0.45"/>
            <circle cx="50" cy="45" r="5.5" fill="#a4d4be" stroke="none" opacity="0.85"/>
          </svg>
        </div>
        <div class="xp-block">
          <div class="xp-val">4,820</div>
          <div class="xp-key">xp</div>
        </div>
      </div>
    </div>

    <div class="controls-card">
      <div class="ctrl-row">
        <span class="ctrl-key">session duration</span>
        <div class="stepper">
          <button class="step-btn" onclick="nudge('dur',-5)">−</button>
          <span class="step-val" id="durVal">30 min</span>
          <button class="step-btn" onclick="nudge('dur',5)">+</button>
        </div>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-key">reminder every</span>
        <div class="stepper">
          <button class="step-btn" onclick="nudge('int',-30)">−</button>
          <span class="step-val" id="intVal">2 min</span>
          <button class="step-btn" onclick="nudge('int',30)">+</button>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary">Begin Session</button>
      <button class="btn ghost">View History</button>
      <button class="btn ghost">About</button>
    </div>
  </div>
</div>

<script>
  var dur = 30, intv = 120;
  function fmtInt(s) { return s < 60 ? s + 's' : (s % 60 === 0 ? (s/60) : (s/60).toFixed(1)) + ' min'; }
  function nudge(which, delta) {
    if (which === 'dur') { dur = Math.max(5, Math.min(480, dur + delta)); document.getElementById('durVal').textContent = dur + ' min'; }
    else { intv = Math.max(30, Math.min(600, intv + delta)); document.getElementById('intVal').textContent = fmtInt(intv); }
  }
</script>
</body>
</html>
