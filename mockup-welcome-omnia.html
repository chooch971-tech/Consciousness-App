<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Presence · Welcome (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#07080d; --surface:#0e0f17;
    --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
    --text:#ddd8ce; --muted:rgba(221,216,206,0.38);
    --accent:#7eb8a4; --accent2:#a4c4b8; --accent-dim:rgba(126,184,164,0.12);
    --crystal:#b8eaff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'DM Mono',monospace;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  /* phone frame just for the mockup — not part of the real screen */
  .phone{
    position:relative; width:min(420px,100vw); height:min(900px,100vh);
    background:radial-gradient(120% 80% at 50% 22%, #0c0e17 0%, var(--bg) 62%);
    display:flex; flex-direction:column;
    padding:0 30px env(safe-area-inset-bottom) 30px;
    overflow:hidden;
  }

  /* soft ambient glow behind the crystal */
  .ambient{
    position:absolute; top:30%; left:50%; transform:translate(-50%,-50%);
    width:340px; height:340px; pointer-events:none;
    background:radial-gradient(circle, rgba(126,184,164,0.10) 0%, rgba(184,234,255,0.05) 35%, transparent 70%);
    filter:blur(6px);
    animation:breathe 7s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform:translate(-50%,-50%) scale(1); opacity:.85; }
    50%{ transform:translate(-50%,-50%) scale(1.12); opacity:1; }
  }

  .hero{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; }

  .crystal-wrap{
    position:relative; width:128px; height:150px;
    display:flex; align-items:center; justify-content:center;
    animation:float 6s ease-in-out infinite;
    margin-bottom:34px;
  }
  @keyframes float{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-9px); }
  }
  .crystal-wrap svg{ filter:drop-shadow(0 0 18px rgba(184,234,255,0.35)); }

  .wordmark{
    font-family:'Cormorant Garamond',serif;
    font-weight:300; font-size:54px; letter-spacing:.02em;
    color:var(--text); line-height:1; margin:0;
  }
  .tagline{
    margin-top:16px;
    font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:300;
    font-size:20px; color:var(--accent2); letter-spacing:.01em;
  }
  .sub{
    margin-top:10px; font-size:10px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--muted);
  }

  .actions{ display:flex; flex-direction:column; gap:12px; padding-bottom:8px; }

  .btn{
    width:100%; padding:18px 24px; border-radius:16px; cursor:pointer;
    font-family:'DM Mono',monospace; font-size:12px; letter-spacing:.18em;
    text-transform:uppercase; transition:transform .12s ease, background .2s, border-color .2s, box-shadow .3s;
    border:1px solid transparent;
  }
  .btn:active{ transform:scale(0.985); }

  .btn--primary{
    background:linear-gradient(180deg, rgba(126,184,164,0.18), rgba(126,184,164,0.10));
    border-color:rgba(126,184,164,0.40); color:var(--accent2);
    box-shadow:0 0 0 rgba(126,184,164,0);
    animation:glow 3.4s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{ box-shadow:0 0 0 rgba(126,184,164,0); }
    50%{ box-shadow:0 0 22px rgba(126,184,164,0.22); }
  }
  .btn--primary:hover{ background:rgba(126,184,164,0.20); }

  .btn--ghost{
    background:transparent; border-color:var(--border2); color:var(--muted);
  }
  .btn--ghost:hover{ border-color:rgba(126,184,164,0.3); color:var(--accent2); }

  /* tiny faux status bar so it reads like a phone */
  .statusbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 4px 0; font-size:12px; color:var(--text); opacity:.65;
    font-variant-numeric:tabular-nums;
  }

  /* clicked-state overlay (so the mockup feels alive) */
  .toast{
    position:absolute; left:50%; bottom:132px; transform:translateX(-50%) translateY(12px);
    background:var(--surface); border:1px solid var(--border2); color:var(--text);
    padding:12px 18px; border-radius:12px; font-size:11px; letter-spacing:.06em;
    opacity:0; pointer-events:none; transition:opacity .3s, transform .3s; white-space:nowrap;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast b{ color:var(--accent2); font-weight:400; }
</style>
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <span>3:58</span>
      <span>● ● ● ●  ⌃  20</span>
    </div>

    <div class="ambient"></div>

    <div class="hero">
      <div class="crystal-wrap">
        <!-- Omnia crystal — faceted gem in the app's signature blue -->
        <svg width="128" height="150" viewBox="0 0 128 150" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="cFace" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#e8f8ff"/>
              <stop offset="1" stop-color="#b8eaff"/>
            </linearGradient>
            <linearGradient id="cSide" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#9fd6ee"/>
              <stop offset="1" stop-color="#6fa9c4"/>
            </linearGradient>
            <linearGradient id="cDark" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#7fb8d6"/>
              <stop offset="1" stop-color="#4d7e98"/>
            </linearGradient>
          </defs>
          <!-- crown -->
          <polygon points="64,8 40,46 64,58 88,46" fill="url(#cFace)"/>
          <polygon points="40,46 22,58 64,82 64,58" fill="url(#cSide)"/>
          <polygon points="88,46 106,58 64,82 64,58" fill="url(#cDark)"/>
          <!-- pavilion -->
          <polygon points="22,58 64,82 64,142" fill="url(#cSide)" opacity="0.92"/>
          <polygon points="106,58 64,82 64,142" fill="url(#cDark)" opacity="0.92"/>
          <polygon points="40,46 64,58 64,82 22,58" fill="url(#cFace)" opacity="0.35"/>
          <!-- inner light -->
          <polygon points="64,58 76,66 64,82 52,66" fill="#ffffff" opacity="0.55"/>
        </svg>
      </div>

      <h1 class="wordmark">Presence</h1>
      <div class="tagline">Be here, now.</div>
      <div class="sub">A practice, not an app</div>
    </div>

    <div class="actions">
      <button class="btn btn--primary" onclick="tap('Begin')">Begin the Practice</button>
      <button class="btn btn--ghost" onclick="tap('Sign in')">I already have an account</button>
    </div>

    <div class="toast" id="toast"></div>
  </div>

<script>
  var t = document.getElementById('toast');
  var timer;
  function tap(which){
    if (which === 'Begin') t.innerHTML = '→ Would open the <b>tutorial / first session</b>';
    else t.innerHTML = '→ Would open <b>Continue with Google</b>';
    t.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }
</script>
</body>
</html>
