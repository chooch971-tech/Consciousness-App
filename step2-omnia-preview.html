<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Omnia · Step II Preview</title>
<style>
  body {
    margin: 0;
    background: radial-gradient(circle at 50% 40%, #0c1018 0%, #050608 75%);
    color: #b8eaff;
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    padding: 40px 16px;
  }
  h1 { font-family: Cormorant Garamond, serif; font-weight: 300; margin: 0; font-size: 28px; letter-spacing: .04em; }
  .kicker { font-size: 9px; letter-spacing: .3em; text-transform: uppercase; color: #8ecce0; }
  .desc { max-width: 460px; text-align: center; font-size: 12px; line-height: 1.7; color: #aab8c4; }

  .stage-row { display: flex; gap: 60px; align-items: flex-end; flex-wrap: wrap; justify-content: center; }
  .stage-col { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .stage-label { font-size: 9px; letter-spacing: .26em; text-transform: uppercase; color: #8ecce0; }

  /* Base Omnia figure (same crystal as the app) */
  .omnia-figure {
    position: relative;
    width: 160px;
    height: 230px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: omniaFloat 4.5s ease-in-out infinite;
    filter: drop-shadow(0 0 16px rgba(160,210,240,.45));
  }
  .omnia-figure svg { width: 100%; height: auto; overflow: visible; }

  /* Ambient aura behind */
  .omnia-aura {
    position: absolute;
    inset: -10%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(184,234,255,.18) 0%, rgba(184,234,255,0) 60%);
    pointer-events: none;
  }
  /* Step II adds a brighter, layered aura */
  .step2 .omnia-aura {
    background:
      radial-gradient(circle, rgba(184,234,255,.32) 0%, rgba(184,234,255,0) 55%),
      radial-gradient(circle at 50% 60%, rgba(196,168,212,.18) 0%, rgba(196,168,212,0) 70%);
  }

  /* Triadic orbit — three shards rotating around Omnia */
  .triad {
    position: absolute;
    inset: 0;
    pointer-events: none;
    transform-style: preserve-3d;
    perspective: 600px;
    display: none;
  }
  .step2 .triad { display: block; }

  .orbit-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 200px;
    height: 200px;
    transform: translate(-50%, -50%) rotateX(72deg);
    animation: orbitSpin 9s linear infinite;
    transform-style: preserve-3d;
  }
  .shard {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 18px;
    height: 22px;
    margin: -11px 0 0 -9px;
    transform-style: preserve-3d;
  }
  .shard-inner {
    position: absolute;
    inset: 0;
    /* Keep the shard upright relative to viewer despite the tilted orbit */
    transform: rotateX(-72deg);
    animation: shardFloat 4.5s ease-in-out infinite;
  }
  .shard svg { width: 100%; height: 100%; overflow: visible; }

  /* Position each shard at 0/120/240° on the ring */
  .shard.physical {
    transform: rotate(0deg) translateX(96px);
  }
  .shard.astral {
    transform: rotate(120deg) translateX(96px);
  }
  .shard.mental {
    transform: rotate(240deg) translateX(96px);
  }
  .shard.physical .shard-inner { color: #e8b8a0; }
  .shard.astral   .shard-inner { color: #c4a8d4; }
  .shard.mental   .shard-inner { color: #a8c8e8; }

  /* Glow for each shard */
  .shard svg { filter: drop-shadow(0 0 6px currentColor) drop-shadow(0 0 12px currentColor); }

  @keyframes omniaFloat {
    0%, 100% { transform: translateY(0) }
    50%      { transform: translateY(-6px) }
  }
  @keyframes orbitSpin {
    from { transform: translate(-50%, -50%) rotateX(72deg) rotateZ(0deg); }
    to   { transform: translate(-50%, -50%) rotateX(72deg) rotateZ(360deg); }
  }
  @keyframes shardFloat {
    0%, 100% { opacity: .85; }
    50%      { opacity: 1; }
  }

  /* Side comparison */
  .legend {
    display: flex;
    gap: 18px;
    font-size: 10px;
    letter-spacing: .14em;
    color: #aab8c4;
    margin-top: 4px;
  }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: middle; }
  .sw-phys { background: #e8b8a0; box-shadow: 0 0 8px #e8b8a0; }
  .sw-astr { background: #c4a8d4; box-shadow: 0 0 8px #c4a8d4; }
  .sw-ment { background: #a8c8e8; box-shadow: 0 0 8px #a8c8e8; }
</style>
</head>
<body>
  <div class="kicker">Bardon Step II · Consolidation</div>
  <h1>Triadic Orbit</h1>
  <div class="desc">
    Omnia has crossed the first threshold. Three orbiting shards — one for the physical, astral, and mental bodies — circle the form, signaling that the bodies are beginning to coordinate.
  </div>

  <div class="stage-row">
    <div class="stage-col">
      <div class="omnia-figure step1">
        <div class="omnia-aura"></div>
        <svg viewBox="0 0 80 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="og1a" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ddf0ff" stop-opacity="0.92"/>
              <stop offset="100%" stop-color="#6ab8d8" stop-opacity="0.48"/>
            </linearGradient>
            <linearGradient id="og2a" x1="100%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.78"/>
              <stop offset="100%" stop-color="#4a9ec0" stop-opacity="0.22"/>
            </linearGradient>
            <radialGradient id="og3a" cx="50%" cy="38%" r="58%">
              <stop offset="0%" stop-color="#b8eaff" stop-opacity="0.38"/>
              <stop offset="100%" stop-color="#2878a0" stop-opacity="0"/>
            </radialGradient>
            <filter id="oga" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <ellipse cx="40" cy="68" rx="28" ry="48" fill="url(#og3a)" opacity="0.55"/>
          <polygon points="40,3 54,14 40,25 26,14" fill="url(#og1a)" stroke="#90cce8" stroke-width="0.55" filter="url(#oga)"/>
          <polygon points="40,3 54,14 40,13" fill="#ceeaff" opacity="0.72"/>
          <polygon points="40,3 26,14 40,13" fill="#b0dcf5" opacity="0.42"/>
          <line x1="40" y1="3" x2="40" y2="25" stroke="#b8e0f8" stroke-width="0.4" opacity="0.55"/>
          <line x1="26" y1="14" x2="54" y2="14" stroke="#b8e0f8" stroke-width="0.4" opacity="0.35"/>
          <polygon points="40,25 60,36 64,58 40,70 16,58 20,36" fill="url(#og1a)" stroke="#88c4e0" stroke-width="0.55"/>
          <polygon points="40,25 60,36 40,44" fill="#d4ecff" opacity="0.52"/>
          <polygon points="40,25 20,36 40,44" fill="#bce0f8" opacity="0.32"/>
          <line x1="40" y1="25" x2="40" y2="70" stroke="#a8d8f2" stroke-width="0.38" opacity="0.48"/>
          <polygon points="16,58 64,58 40,70" fill="url(#og2a)" opacity="0.38"/>
          <polygon points="40,70 64,58 56,88 40,100 24,88 16,58" fill="url(#og1a)" stroke="#88c4e0" stroke-width="0.55" opacity="0.88"/>
          <polygon points="40,100 56,88 40,114" fill="url(#og2a)" stroke="#88c4e0" stroke-width="0.48" opacity="0.72"/>
          <polygon points="40,100 24,88 40,114" fill="#b4dcf4" stroke="#88c4e0" stroke-width="0.48" opacity="0.52"/>
        </svg>
      </div>
      <div class="stage-label">Step I (current)</div>
    </div>

    <div class="stage-col">
      <div class="omnia-figure step2">
        <div class="omnia-aura"></div>
        <svg viewBox="0 0 80 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="og1b" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ddf0ff" stop-opacity="0.92"/>
              <stop offset="100%" stop-color="#6ab8d8" stop-opacity="0.48"/>
            </linearGradient>
            <linearGradient id="og2b" x1="100%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.78"/>
              <stop offset="100%" stop-color="#4a9ec0" stop-opacity="0.22"/>
            </linearGradient>
            <radialGradient id="og3b" cx="50%" cy="38%" r="58%">
              <stop offset="0%" stop-color="#b8eaff" stop-opacity="0.38"/>
              <stop offset="100%" stop-color="#2878a0" stop-opacity="0"/>
            </radialGradient>
            <filter id="ogb" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <ellipse cx="40" cy="68" rx="28" ry="48" fill="url(#og3b)" opacity="0.55"/>
          <polygon points="40,3 54,14 40,25 26,14" fill="url(#og1b)" stroke="#90cce8" stroke-width="0.55" filter="url(#ogb)"/>
          <polygon points="40,3 54,14 40,13" fill="#ceeaff" opacity="0.72"/>
          <polygon points="40,3 26,14 40,13" fill="#b0dcf5" opacity="0.42"/>
          <line x1="40" y1="3" x2="40" y2="25" stroke="#b8e0f8" stroke-width="0.4" opacity="0.55"/>
          <line x1="26" y1="14" x2="54" y2="14" stroke="#b8e0f8" stroke-width="0.4" opacity="0.35"/>
          <polygon points="40,25 60,36 64,58 40,70 16,58 20,36" fill="url(#og1b)" stroke="#88c4e0" stroke-width="0.55"/>
          <polygon points="40,25 60,36 40,44" fill="#d4ecff" opacity="0.52"/>
          <polygon points="40,25 20,36 40,44" fill="#bce0f8" opacity="0.32"/>
          <line x1="40" y1="25" x2="40" y2="70" stroke="#a8d8f2" stroke-width="0.38" opacity="0.48"/>
          <polygon points="16,58 64,58 40,70" fill="url(#og2b)" opacity="0.38"/>
          <polygon points="40,70 64,58 56,88 40,100 24,88 16,58" fill="url(#og1b)" stroke="#88c4e0" stroke-width="0.55" opacity="0.88"/>
          <polygon points="40,100 56,88 40,114" fill="url(#og2b)" stroke="#88c4e0" stroke-width="0.48" opacity="0.72"/>
          <polygon points="40,100 24,88 40,114" fill="#b4dcf4" stroke="#88c4e0" stroke-width="0.48" opacity="0.52"/>
        </svg>
        <div class="triad">
          <div class="orbit-ring">
            <div class="shard physical">
              <div class="shard-inner">
                <svg viewBox="0 0 18 22"><polygon points="9,1 17,8 13,21 5,21 1,8" fill="currentColor" stroke="rgba(255,255,255,.6)" stroke-width="0.6"/></svg>
              </div>
            </div>
            <div class="shard astral">
              <div class="shard-inner">
                <svg viewBox="0 0 18 22"><polygon points="9,1 17,8 13,21 5,21 1,8" fill="currentColor" stroke="rgba(255,255,255,.6)" stroke-width="0.6"/></svg>
              </div>
            </div>
            <div class="shard mental">
              <div class="shard-inner">
                <svg viewBox="0 0 18 22"><polygon points="9,1 17,8 13,21 5,21 1,8" fill="currentColor" stroke="rgba(255,255,255,.6)" stroke-width="0.6"/></svg>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="stage-label">Step II · Triadic Orbit</div>
    </div>
  </div>

  <div class="legend">
    <span><span class="swatch sw-phys"></span>Physical</span>
    <span><span class="swatch sw-astr"></span>Astral</span>
    <span><span class="swatch sw-ment"></span>Mental</span>
  </div>
</body>
</html>
