<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omnia · All Steps</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #070810;
  --surface: #0d0f1a;
  --border: rgba(184,234,255,.10);
  --muted: rgba(200,220,240,.45);
  --accent: #8ecce0;
  --gold: #f0d39a;
}

html, body {
  background: var(--bg);
  color: #d8eef8;
  font-family: 'DM Mono', monospace;
  min-height: 100vh;
  overflow-x: hidden;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: 28px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--accent);
  text-align: center;
  padding: 36px 20px 8px;
  opacity: .88;
}
.sub {
  text-align: center;
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--muted);
  padding-bottom: 32px;
}

/* ── Nav pills ─────────────────────────────────────────────── */
.nav {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  padding: 0 16px 28px;
}
.nav-pill {
  background: none;
  border: 1px solid rgba(142,204,224,.22);
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  padding: 5px 12px;
  border-radius: 20px;
  cursor: pointer;
  transition: all .2s;
}
.nav-pill:hover, .nav-pill.active {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(142,204,224,.08);
}

/* ── Step grid ─────────────────────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
  padding: 0 20px 60px;
  max-width: 1200px;
  margin: 0 auto;
}

/* ── Single step card ──────────────────────────────────────── */
.step-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px 16px 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  cursor: pointer;
  transition: border-color .25s, background .25s;
  position: relative;
  overflow: visible;
}
.step-card:hover {
  border-color: rgba(142,204,224,.3);
  background: rgba(13,15,26,.8);
}
.step-card.active-card {
  border-color: rgba(142,204,224,.55);
  background: rgba(13,15,26,.95);
}

.step-roman {
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px;
  letter-spacing: .32em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
}
.step-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  font-weight: 300;
  color: #d8eef8;
  text-align: center;
  line-height: 1.4;
}
.step-desc {
  font-size: 9.5px;
  line-height: 1.75;
  color: var(--muted);
  text-align: center;
}
.step-req {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}
.req-badge {
  font-size: 8px;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 10px;
  border: 1px solid;
}
.req-badge.phys { color: #e8b8a0; border-color: rgba(232,184,160,.3); background: rgba(232,184,160,.06); }
.req-badge.astr { color: #c4a8d4; border-color: rgba(196,168,212,.3); background: rgba(196,168,212,.06); }
.req-badge.ment { color: #a8c8e8; border-color: rgba(168,200,232,.3); background: rgba(168,200,232,.06); }
.req-badge.sess { color: var(--gold); border-color: rgba(240,211,154,.3); background: rgba(240,211,154,.06); }

/* ── Omnia figure container ────────────────────────────────── */
.fig-wrap {
  position: relative;
  width: 110px;
  height: 160px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.omnia-figure {
  position: relative;
  width: 88px;
  height: 128px;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: omniaFloat 4.5s ease-in-out infinite;
  filter: drop-shadow(0 0 8px rgba(160,210,240,.35));
  z-index: 2;
}
.omnia-crystal-layer {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.omnia-crystal-layer svg { width: 100%; height: 100%; overflow: visible; }

@keyframes omniaFloat {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

/* ── Step II: Triad Orbit ──────────────────────────────────── */
.omnia-triad-orbit {
  --orbit-radius: 56px;
  position: absolute;
  inset: 0;
  pointer-events: none;
  transform-style: preserve-3d;
  perspective: 600px;
  z-index: 4;
}
.triad-ring {
  position: absolute;
  top: 50%; left: 50%;
  width: 0; height: 0;
  transform: translate(-50%,-50%) rotateX(72deg);
  animation: omniaTriadSpin 9s linear infinite;
  transform-style: preserve-3d;
}
.triad-shard {
  position: absolute;
  top: 0; left: 0;
  width: 14px; height: 17px;
  margin: -8.5px 0 0 -7px;
  transform-style: preserve-3d;
}
.triad-shard-inner {
  position: absolute;
  inset: 0;
  transform: rotateX(-72deg);
  animation: omniaTriadFloat 4.5s ease-in-out infinite;
}
.triad-shard svg { width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 4px currentColor) drop-shadow(0 0 9px currentColor); }
.triad-shard.t-physical { transform: rotate(0deg)   translateX(var(--orbit-radius)); }
.triad-shard.t-astral   { transform: rotate(120deg) translateX(var(--orbit-radius)); }
.triad-shard.t-mental   { transform: rotate(240deg) translateX(var(--orbit-radius)); }
.triad-shard.t-physical .triad-shard-inner { color: #e8b8a0; }
.triad-shard.t-astral   .triad-shard-inner { color: #c4a8d4; }
.triad-shard.t-mental   .triad-shard-inner { color: #a8c8e8; }
@keyframes omniaTriadSpin  { from{transform:translate(-50%,-50%) rotateX(72deg) rotateZ(0deg);} to{transform:translate(-50%,-50%) rotateX(72deg) rotateZ(360deg);} }
@keyframes omniaTriadFloat { 0%,100%{opacity:.82;} 50%{opacity:1;} }

/* ── Step III: Crown ───────────────────────────────────────── */
.omnia-crown {
  position: absolute;
  top: -10px; left: 50%;
  transform: translateX(-50%);
  width: 60px; height: 60px;
  pointer-events: none;
  z-index: 3;
  background: radial-gradient(circle, rgba(232,232,200,.48) 0%, rgba(232,232,200,.22) 36%, rgba(232,232,200,0) 68%);
  border-radius: 50%;
  animation: omniaCrownPulse 4.4s ease-in-out infinite;
  mix-blend-mode: screen;
}
.omnia-crown::before {
  content: '';
  position: absolute;
  inset: 18%;
  border-radius: 50%;
  border: 1px solid rgba(240,220,160,.40);
  box-shadow: 0 0 12px rgba(240,220,160,.36), inset 0 0 8px rgba(240,220,160,.20);
}
@keyframes omniaCrownPulse { 0%,100%{opacity:.8;transform:translateX(-50%) scale(.96);} 50%{opacity:1;transform:translateX(-50%) scale(1.06);} }

/* ── Step IV: Polar Pillars ────────────────────────────────── */
.omnia-polar { position:absolute;inset:0;pointer-events:none;z-index:3; }
.omnia-polar-pillar {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 4px; height: 74px;
  border-radius: 3px;
  background: linear-gradient(to top, rgba(190,224,255,0) 0%, rgba(200,230,255,.5) 32%, rgba(224,242,255,.78) 50%, rgba(200,230,255,.5) 68%, rgba(190,224,255,0) 100%);
  box-shadow: 0 0 8px 2px rgba(180,218,255,.4);
  animation: polarPillar 3.6s ease-in-out infinite;
}
.omnia-polar-pillar.left  { left: -3px; }
.omnia-polar-pillar.right { right: -3px; animation-delay: 1.8s; }
@keyframes polarPillar { 0%,100%{opacity:.4;transform:translateY(-50%) scaleY(.9);} 50%{opacity:.92;transform:translateY(-50%) scaleY(1.06);} }

/* ── Step V: Element Wheel + Mantle ───────────────────────── */
.omnia-mantle {
  position: absolute;
  inset: -22%;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  background: radial-gradient(circle, rgba(255,238,200,.18) 0%, rgba(255,238,200,.10) 30%, rgba(255,238,200,0) 62%),
              conic-gradient(from 0deg, rgba(232,184,160,.10), rgba(196,168,212,.10), rgba(168,200,232,.10), rgba(140,196,160,.10), rgba(232,184,160,.10));
  animation: omniaMantleSpin 22s linear infinite, omniaMantlePulse 6s ease-in-out infinite;
  filter: blur(2px);
  mix-blend-mode: screen;
}
.omnia-elements { position:absolute;inset:0;pointer-events:none;z-index:5;animation:omniaElemSpin 26s linear infinite; }
.omnia-element {
  position: absolute;
  top: 50%; left: 50%;
  width: 13px; height: 13px;
  margin: -6.5px 0 0 -6.5px;
  border-radius: 50%;
  animation: omniaElemPulse 4.6s ease-in-out infinite;
}
.omnia-element::before {
  content: '';
  position: absolute;
  inset: -45%;
  border-radius: 50%;
  background: radial-gradient(circle, currentColor 0%, transparent 70%);
  opacity: .42;
  filter: blur(2px);
}
.omnia-element.e-fire  { transform:translate(0,-66px);  color:#ff8b4d; background:radial-gradient(circle,#ffe2c0 0%,#ff8b4d 60%,#b04420 100%); box-shadow:0 0 9px #ff8b4d; }
.omnia-element.e-air   { transform:translate(66px,0);   color:#f5e29a; background:radial-gradient(circle,#fff8d8 0%,#f5e29a 60%,#b8a160 100%); box-shadow:0 0 9px #f5e29a; animation-delay:1.15s; }
.omnia-element.e-water { transform:translate(0,66px);   color:#6bb8ff; background:radial-gradient(circle,#d6efff 0%,#6bb8ff 60%,#2870a8 100%); box-shadow:0 0 9px #6bb8ff; animation-delay:2.3s; }
.omnia-element.e-earth { transform:translate(-66px,0);  color:#8fc880; background:radial-gradient(circle,#d8f0c8 0%,#8fc880 60%,#4a7a48 100%); box-shadow:0 0 9px #8fc880; animation-delay:3.45s; }
@keyframes omniaElemSpin  { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
@keyframes omniaElemPulse { 0%,100%{filter:brightness(1);} 50%{filter:brightness(1.35);} }
@keyframes omniaMantleSpin  { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
@keyframes omniaMantlePulse { 0%,100%{opacity:.72;} 50%{opacity:1;} }

/* ── Step VI: Etheric Echo ─────────────────────────────────── */
.omnia-echo { position:absolute;inset:0;pointer-events:none;z-index:0; }
.omnia-echo-ghost { position:absolute;inset:0;opacity:0;animation:omniaEchoFloat 7s ease-in-out infinite; }
.omnia-echo-ghost:nth-child(1) { animation-delay:0s; }
.omnia-echo-ghost:nth-child(2) { animation-delay:2.3s; }
.omnia-echo-ghost:nth-child(3) { animation-delay:4.6s; }
@keyframes omniaEchoFloat { 0%,100%{opacity:0;} 20%,80%{opacity:.20;} 50%{opacity:.32;} }

/* ── Step VII: Sensory Beams ───────────────────────────────── */
.omnia-senses { position:absolute;inset:-30%;pointer-events:none;z-index:2;animation:omniaSensesSpin 50s linear infinite; }
.omnia-sense-beam {
  position: absolute;
  top: 50%; left: 50%;
  height: 1px;
  transform-origin: 0 50%;
  opacity: 0;
  background: linear-gradient(90deg,rgba(176,224,230,0),rgba(176,224,230,0.42),rgba(176,224,230,0));
  animation: omniaSensesPulse 6s ease-in-out infinite;
}
.omnia-sense-beam:nth-child(1) { transform:rotate(0deg);   width:52%; animation-delay:0s;    }
.omnia-sense-beam:nth-child(2) { transform:rotate(45deg);  width:48%; animation-delay:.75s;  }
.omnia-sense-beam:nth-child(3) { transform:rotate(90deg);  width:52%; animation-delay:1.5s;  }
.omnia-sense-beam:nth-child(4) { transform:rotate(135deg); width:48%; animation-delay:2.25s; }
.omnia-sense-beam:nth-child(5) { transform:rotate(180deg); width:52%; animation-delay:3s;    }
.omnia-sense-beam:nth-child(6) { transform:rotate(225deg); width:48%; animation-delay:3.75s; }
.omnia-sense-beam:nth-child(7) { transform:rotate(270deg); width:52%; animation-delay:4.5s;  }
.omnia-sense-beam:nth-child(8) { transform:rotate(315deg); width:48%; animation-delay:5.25s; }
@keyframes omniaSensesPulse { 0%,100%{opacity:0;} 50%{opacity:1;} }
@keyframes omniaSensesSpin  { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

/* ── Step VIII: Living Currents ────────────────────────────── */
.omnia-currents { position:absolute;inset:-8%;pointer-events:none;z-index:3;overflow:hidden;border-radius:50%; }
.omnia-current-stream { position:absolute;width:2px;border-radius:1px;opacity:0;animation:omniaCurrentFlow 5.5s ease-in-out infinite; }
.omnia-current-stream.cs-1 { left:28%;top:0;height:42%;background:linear-gradient(180deg,transparent,rgba(100,180,255,0.6),transparent);animation-delay:0s; }
.omnia-current-stream.cs-2 { left:48%;top:8%;height:60%;background:linear-gradient(180deg,transparent,rgba(255,155,138,0.5),transparent);animation-delay:1.1s; }
.omnia-current-stream.cs-3 { left:68%;top:4%;height:50%;background:linear-gradient(180deg,transparent,rgba(100,180,255,0.5),transparent);animation-delay:2.2s; }
.omnia-current-stream.cs-4 { left:18%;top:12%;height:45%;background:linear-gradient(180deg,transparent,rgba(255,155,138,0.4),transparent);animation-delay:3.3s; }
.omnia-current-stream.cs-5 { left:80%;top:18%;height:38%;background:linear-gradient(180deg,transparent,rgba(100,180,255,0.4),transparent);animation-delay:4.4s; }
@keyframes omniaCurrentFlow { 0%{opacity:0;transform:translateY(0);} 30%{opacity:1;} 70%{opacity:1;} 100%{opacity:0;transform:translateY(28px);} }

/* ── Step IX: Astral Mirror ────────────────────────────────── */
.omnia-mirror {
  position: absolute;
  bottom: -20%; left: 50%;
  transform: translateX(-50%) rotateX(72deg);
  width: 88%; height: 38%;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  background: radial-gradient(ellipse at center,rgba(160,210,240,0.16) 0%,rgba(160,210,240,0.07) 42%,transparent 70%);
  border: 1px solid rgba(160,210,240,0.18);
  animation: omniaMirrorPulse 5.5s ease-in-out infinite;
}
.omnia-mirror-reflection {
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 55%; height: 100%;
  background: linear-gradient(180deg,rgba(200,230,255,0.10) 0%,transparent 60%);
  border-radius: 50%;
  filter: blur(3px);
}
@keyframes omniaMirrorPulse { 0%,100%{opacity:.55;} 50%{opacity:1;} }

/* ── Step X: Apotheosis Mandala ────────────────────────────── */
.omnia-apotheosis {
  position: absolute;
  inset: -52%;
  pointer-events: none;
  z-index: 0;
  animation: omniaApotheosisSpin 70s linear infinite;
}
.omnia-apo-ring {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  border-radius: 50%;
  border: 1px solid;
  animation: omniaApotheosisPulse 8s ease-in-out infinite;
}
.omnia-apo-ring:nth-child(1) { width:44%;height:44%;border-color:rgba(255,238,200,.24);animation-delay:0s; }
.omnia-apo-ring:nth-child(2) { width:64%;height:64%;border-color:rgba(220,180,140,.16);animation-delay:1.2s; }
.omnia-apo-ring:nth-child(3) { width:84%;height:84%;border-color:rgba(200,160,120,.10);animation-delay:2.4s; }
.omnia-apo-dot {
  position: absolute;
  width: 4px; height: 4px;
  margin: -2px 0 0 -2px;
  border-radius: 50%;
  background: rgba(255,238,200,.65);
  animation: omniaApoDotPulse 4.5s ease-in-out infinite;
}
@keyframes omniaApotheosisSpin   { from{transform:rotate(0deg);}  to{transform:rotate(360deg);} }
@keyframes omniaApotheosisPulse  { 0%,100%{opacity:.55;}  50%{opacity:1;} }
@keyframes omniaApoDotPulse { 0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.65;} 50%{transform:translate(-50%,-50%) scale(1.6);opacity:1;} }

/* ── Apotheosis glow on the figure ─ */
.fig-step-10 .omnia-figure {
  filter: drop-shadow(0 0 22px rgba(255,238,200,.40)) drop-shadow(0 0 50px rgba(255,238,200,.18));
}
.fig-step-5 .omnia-figure {
  filter: drop-shadow(0 0 18px rgba(255,238,200,.28));
}

/* ── Unlock labels ─────────────────────────────────────────── */
.unlock-tag {
  font-size: 8px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
}
.unlock-tag span {
  color: var(--accent);
}

/* ── Lightbox ──────────────────────────────────────────────── */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 900;
  background: rgba(7,8,13,.92);
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}
.lightbox.open { display: flex; }
.lb-inner {
  background: var(--surface);
  border: 1px solid rgba(142,204,224,.2);
  border-radius: 20px;
  padding: 40px 32px 32px;
  max-width: 420px;
  width: 92vw;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  position: relative;
  animation: lbEnter .28s cubic-bezier(.34,1.3,.64,1) both;
}
@keyframes lbEnter { from{transform:scale(.9);opacity:0;} to{transform:scale(1);opacity:1;} }
.lb-close {
  position: absolute;
  top: 14px; right: 16px;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 18px;
  cursor: pointer;
  line-height: 1;
  padding: 4px 8px;
}
.lb-close:hover { color: #d8eef8; }
.lb-fig-wrap {
  position: relative;
  width: 160px;
  height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.lb-fig-wrap .omnia-figure {
  width: 120px;
  height: 174px;
}
.lb-fig-wrap .omnia-triad-orbit { --orbit-radius: 80px; }
.lb-fig-wrap .triad-shard { width: 17px; height: 21px; margin: -10.5px 0 0 -8.5px; }
.lb-fig-wrap .omnia-crown { top: -16px; width: 72px; height: 72px; }
.lb-fig-wrap .omnia-polar-pillar { height: 100px; }
.lb-fig-wrap .omnia-element { width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px; }
.lb-fig-wrap .omnia-element.e-fire  { transform: translate(0,-80px); }
.lb-fig-wrap .omnia-element.e-air   { transform: translate(80px,0); }
.lb-fig-wrap .omnia-element.e-water { transform: translate(0,80px); }
.lb-fig-wrap .omnia-element.e-earth { transform: translate(-80px,0); }
.lb-roman {
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--muted);
}
.lb-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 300;
  color: #d8eef8;
  text-align: center;
}
.lb-desc {
  font-size: 11px;
  line-height: 1.8;
  color: var(--muted);
  text-align: center;
}
.lb-req {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}
.lb-effects {
  width: 100%;
  border-top: 1px solid var(--border);
  padding-top: 14px;
}
.lb-effects-title {
  font-size: 8px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
  text-align: center;
}
.lb-effect-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.lb-effect {
  font-size: 10px;
  color: rgba(200,220,240,.7);
  display: flex;
  align-items: center;
  gap: 8px;
}
.lb-effect-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--accent);
  opacity: .55;
}
.lb-effect.new .lb-effect-dot { opacity: 1; background: #b8eaff; box-shadow: 0 0 5px #b8eaff; }
.lb-effect.new { color: #d8eef8; }
</style>
</head>
<body>

<h1>Omnia</h1>
<p class="sub">Bardon Steps I – X · Visual Progression</p>

<div class="nav" id="navBar"></div>
<div class="grid" id="stepGrid"></div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLb()">
  <div class="lb-inner">
    <button class="lb-close" onclick="closeLb()">✕</button>
    <div class="lb-roman" id="lbRoman"></div>
    <div class="lb-fig-wrap" id="lbFig"></div>
    <div class="lb-name" id="lbName"></div>
    <div class="lb-desc" id="lbDesc"></div>
    <div class="lb-req" id="lbReq"></div>
    <div class="lb-effects">
      <div class="lb-effects-title">Visual Effects Active at This Step</div>
      <div class="lb-effect-list" id="lbEffects"></div>
    </div>
  </div>
</div>

<script>
var STEPS = [
  { step:1, roman:'I',   name:'Fundamentals',     desc:'Your work will build Omnia and both of you will grow together. You must still the mind and prepare yourself astrally to ascend to the next step.',
    req:{ physical:12, astral:12, mental:12, recommended:4 } },

var EFFECTS = [
  { step:1, label:'Omnia crystal — the base guide-form', isNew:true },
  { step:2, label:'Triad orbit — three body-shards circle in 3-D space', isNew:true },
  { step:3, label:'Crown aureole — golden radiance above the figure', isNew:true },
  { step:4, label:'Polar pillars — twin luminous columns flank the form', isNew:true },
  { step:5, label:'Luminous mantle — conic elemental aura wraps the body', isNew:true },
  { step:5, label:'Element wheel — Fire · Air · Water · Earth spin in orbit', isNew:true },
  { step:6, label:'Etheric echo — three ghost-images drift and fade', isNew:true },
  { step:7, label:'Sensory beams — eight radial beams pulse outward', isNew:true },
  { step:8, label:'Living currents — electric streams rise through the form', isNew:true },
  { step:9, label:'Astral mirror — a luminous disc pools below the figure', isNew:true },
  { step:10, label:'Apotheosis mandala — sacred geometry rings + 12 dots', isNew:true },
  { step:10, label:'Apotheosis glow — golden drop-shadow halos the crystal', isNew:true },
];

var CRYSTAL_SVG = '<svg viewBox="0 0 80 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'

  + '<linearGradient id="cOg1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ddf0ff" stop-opacity="0.92"/><stop offset="100%" stop-color="#6ab8d8" stop-opacity="0.48"/></linearGradient>'
  + '<linearGradient id="cOg2" x1="100%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.78"/><stop offset="100%" stop-color="#4a9ec0" stop-opacity="0.22"/></linearGradient>'
  + '<radialGradient id="cOg3" cx="50%" cy="38%" r="58%"><stop offset="0%" stop-color="#b8eaff" stop-opacity="0.42"/><stop offset="100%" stop-color="#2878a0" stop-opacity="0"/></radialGradient>'
  + '<filter id="cOglow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'
  + '</defs>'
  + '<ellipse cx="40" cy="68" rx="28" ry="48" fill="url(#cOg3)" opacity="0.62"/>'
  + '<polygon points="40,3 54,14 40,25 26,14" fill="url(#cOg1)" stroke="#90cce8" stroke-width="0.55" filter="url(#cOglow)"/>'
  + '<polygon points="40,3 54,14 40,13" fill="#ceeaff" opacity="0.72"/>'
  + '<polygon points="40,3 26,14 40,13" fill="#b0dcf5" opacity="0.42"/>'
  + '<line x1="40" y1="3" x2="40" y2="25" stroke="#b8e0f8" stroke-width="0.4" opacity="0.55"/>'
  + '<line x1="26" y1="14" x2="54" y2="14" stroke="#b8e0f8" stroke-width="0.4" opacity="0.35"/>'
  + '<polygon points="40,25 60,36 64,58 40,70 16,58 20,36" fill="url(#cOg1)" stroke="#88c4e0" stroke-width="0.55"/>'
  + '<polygon points="40,25 60,36 40,44" fill="#d4ecff" opacity="0.52"/>'
  + '<polygon points="40,25 20,36 40,44" fill="#bce0f8" opacity="0.32"/>'
  + '<line x1="40" y1="25" x2="40" y2="70" stroke="#a8d8f2" stroke-width="0.38" opacity="0.48"/>'
  + '<polygon points="16,58 64,58 40,70" fill="url(#cOg2)" opacity="0.38"/>'
  + '<polygon points="40,70 64,58 56,88 40,100 24,88 16,58" fill="url(#cOg1)" stroke="#88c4e0" stroke-width="0.55" opacity="0.88"/>'
  + '<polygon points="40,100 56,88 40,114" fill="url(#cOg2)" stroke="#88c4e0" stroke-width="0.48" opacity="0.72"/>'
  + '<polygon points="40,100 24,88 40,114" fill="#b4dcf4" stroke="#88c4e0" stroke-width="0.48" opacity="0.52"/>'
  + '<g opacity="0.65" filter="url(#cOglow)"><line x1="6" y1="22" x2="12" y2="22" stroke="#b8eaff" stroke-width="1"/><line x1="9" y1="19" x2="9" y2="25" stroke="#b8eaff" stroke-width="1"/></g>'
  + '<g opacity="0.48"><line x1="68" y1="48" x2="74" y2="48" stroke="#b8eaff" stroke-width="0.9"/><line x1="71" y1="45" x2="71" y2="51" stroke="#b8eaff" stroke-width="0.9"/></g>'
  + '</svg>';

function buildFigure(stepNum, largeClass) {
  var wrap = document.createElement('div');
  wrap.className = 'fig-wrap' + (largeClass ? ' ' + largeClass : '') + ' fig-step-' + stepNum;

  var fig = document.createElement('div');
  fig.className = 'omnia-figure';

  // Echo (behind) — step 6+
  if (stepNum >= 6) {
    var echo = document.createElement('div');
    echo.className = 'omnia-echo';
    var ghosts = [
      'translate(-13px,-7px) scale(0.87)',
      'translate(13px,-4px) scale(0.81)',
      'translate(0px,13px) scale(0.76)'
    ];
    ghosts.forEach(function(t, i) {
      echo.innerHTML += '<div class="omnia-echo-ghost" style="transform:' + t + ';filter:blur(' + (i+1) + 'px) hue-rotate(' + (i*30+20) + 'deg);">'
        + '<svg viewBox="0 0 80 130" style="width:100%;height:100%;opacity:' + (0.30 - i*0.07) + ';">' + CRYSTAL_SVG.replace(/<svg[^>]*>/, '').replace('</svg>','') + '</svg>'
        + '</div>';
    });
    fig.insertBefore(echo, fig.firstChild);
  }

  // Senses (behind) — step 7+
  if (stepNum >= 7) {
    var senses = document.createElement('div');
    senses.className = 'omnia-senses';
    for (var i = 0; i < 8; i++) senses.innerHTML += '<div class="omnia-sense-beam"></div>';
    fig.insertBefore(senses, fig.firstChild);
  }

  // Apotheosis (behind) — step 10
  if (stepNum >= 10) {
    var apo = document.createElement('div');
    apo.className = 'omnia-apotheosis';
    apo.innerHTML = '<div class="omnia-apo-ring"></div><div class="omnia-apo-ring"></div><div class="omnia-apo-ring"></div>';
    var angles = [0,30,60,90,120,150,180,210,240,270,300,330];
    angles.forEach(function(a) {
      var rad = a * Math.PI / 180;
      var x = 50 + 42 * Math.cos(rad);
      var y = 50 + 42 * Math.sin(rad);
      apo.innerHTML += '<div class="omnia-apo-dot" style="left:' + x.toFixed(1) + '%;top:' + y.toFixed(1) + '%;"></div>';
    });
    fig.insertBefore(apo, fig.firstChild);
  }

  // Mantle (step 5+, z-index 0)
  if (stepNum >= 5) {
    var mantle = document.createElement('div');
    mantle.className = 'omnia-mantle';
    fig.appendChild(mantle);
  }

  // Crystal layer
  var crystal = document.createElement('div');
  crystal.className = 'omnia-crystal-layer';
  crystal.innerHTML = CRYSTAL_SVG;
  fig.appendChild(crystal);

  // Crown — step 3+
  if (stepNum >= 3) {
    var crown = document.createElement('div');
    crown.className = 'omnia-crown';
    fig.appendChild(crown);
  }

  // Polar — step 4+
  if (stepNum >= 4) {
    var polar = document.createElement('div');
    polar.className = 'omnia-polar';
    polar.innerHTML = '<div class="omnia-polar-pillar left"></div><div class="omnia-polar-pillar right"></div>';
    fig.appendChild(polar);
  }

  // Element wheel — step 5+
  if (stepNum >= 5) {
    var wheel = document.createElement('div');
    wheel.className = 'omnia-elements';
    wheel.innerHTML = '<div class="omnia-element e-fire"></div><div class="omnia-element e-air"></div><div class="omnia-element e-water"></div><div class="omnia-element e-earth"></div>';
    fig.appendChild(wheel);
  }

  // Currents — step 8+
  if (stepNum >= 8) {
    var cur = document.createElement('div');
    cur.className = 'omnia-currents';
    cur.innerHTML = '<div class="omnia-current-stream cs-1"></div><div class="omnia-current-stream cs-2"></div><div class="omnia-current-stream cs-3"></div><div class="omnia-current-stream cs-4"></div><div class="omnia-current-stream cs-5"></div>';
    fig.appendChild(cur);
  }

  // Mirror — step 9+
  if (stepNum >= 9) {
    var mirror = document.createElement('div');
    mirror.className = 'omnia-mirror';
    mirror.innerHTML = '<div class="omnia-mirror-reflection"></div>';
    fig.appendChild(mirror);
  }

  // Triad orbit — step 2+
  if (stepNum >= 2) {
    var triad = document.createElement('div');
    triad.className = 'omnia-triad-orbit';
    triad.innerHTML = '<div class="triad-ring">'
      + ['t-physical','t-astral','t-mental'].map(function(c) {
          return '<div class="triad-shard ' + c + '"><div class="triad-shard-inner">'
            + '<svg viewBox="0 0 18 22"><polygon points="9,1 17,8 13,21 5,21 1,8" fill="currentColor" stroke="rgba(255,255,255,.6)" stroke-width="0.6"/></svg>'
            + '</div></div>';
        }).join('')
      + '</div>';
    fig.appendChild(triad);
  }

  wrap.appendChild(fig);
  return wrap;
}

function buildReqBadges(req, container) {
  container.innerHTML = '';
  [
    { key:'physical', cls:'phys', label:'Phys' },
    { key:'astral',   cls:'astr', label:'Astr' },
    { key:'mental',   cls:'ment', label:'Ment' },
    { key:'recommended', cls:'sess', label:'Sessions' },
  ].forEach(function(b) {
    if (!req[b.key]) return;
    var span = document.createElement('span');
    span.className = 'req-badge ' + b.cls;
    span.textContent = b.label + ' ' + req[b.key];
    container.appendChild(span);
  });
}

// Build nav pills
var navBar = document.getElementById('navBar');
STEPS.forEach(function(s) {
  var btn = document.createElement('button');
  btn.className = 'nav-pill';
  btn.textContent = 'Step ' + s.roman;
  btn.onclick = function() { openLb(s.step); };
  navBar.appendChild(btn);
});

// Build grid
var grid = document.getElementById('stepGrid');
STEPS.forEach(function(s) {
  var card = document.createElement('div');
  card.className = 'step-card';
  card.id = 'card-' + s.step;
  card.onclick = function() { openLb(s.step); };

  var roman = document.createElement('div');
  roman.className = 'step-roman';
  roman.textContent = 'Step ' + s.roman;

  var figWrap = buildFigure(s.step, '');

  var name = document.createElement('div');
  name.className = 'step-name';
  name.textContent = s.name;

  var desc = document.createElement('div');
  desc.className = 'step-desc';
  desc.textContent = s.desc;

  var req = document.createElement('div');
  req.className = 'step-req';
  buildReqBadges(s.req, req);

  var newEffect = EFFECTS.filter(function(e) { return e.step === s.step; })[0];
  var tag = document.createElement('div');
  tag.className = 'unlock-tag';
  if (newEffect) {
    tag.innerHTML = 'Unlocks: <span>' + newEffect.label.split('—')[0].trim() + '</span>';
  }

  card.appendChild(roman);
  card.appendChild(figWrap);
  card.appendChild(name);
  card.appendChild(desc);
  card.appendChild(req);
  if (newEffect) card.appendChild(tag);

  grid.appendChild(card);
});

// Lightbox
function openLb(stepNum) {
  var s = STEPS.find(function(x) { return x.step === stepNum; });
  if (!s) return;

  document.getElementById('lbRoman').textContent = 'Step ' + s.roman;
  document.getElementById('lbName').textContent = s.name;
  document.getElementById('lbDesc').textContent = s.desc;

  var lbFig = document.getElementById('lbFig');
  lbFig.innerHTML = '';
  lbFig.appendChild(buildFigure(s.step, 'lb-fig-wrap'));

  buildReqBadges(s.req, document.getElementById('lbReq'));

  var effectsEl = document.getElementById('lbEffects');
  effectsEl.innerHTML = '';
  EFFECTS.filter(function(e) { return e.step <= stepNum; }).forEach(function(e) {
    var row = document.createElement('div');
    row.className = 'lb-effect' + (e.step === stepNum ? ' new' : '');
    row.innerHTML = '<div class="lb-effect-dot"></div><span>' + e.label + '</span>';
    effectsEl.appendChild(row);
  });

  document.getElementById('lightbox').classList.add('open');
  document.querySelectorAll('.step-card').forEach(function(c) { c.classList.remove('active-card'); });
  var card = document.getElementById('card-' + stepNum);
  if (card) card.classList.add('active-card');
}

function closeLb() {
  document.getElementById('lightbox').classList.remove('open');
  document.querySelectorAll('.step-card').forEach(function(c) { c.classList.remove('active-card'); });
}

document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLb(); });
</script>
