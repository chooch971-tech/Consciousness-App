<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Concentration — The Magician</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#07080d; --surface:#0e0f17; --surface2:#13141f; --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
    --text:#ddd8ce; --muted:rgba(221,216,206,0.38);
    --copper:#d4956e; --gold:#d4b08e; --gold-soft:#e8c79c; --cream:#ffe8d4; --copper-dim:rgba(212,149,110,0.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:var(--bg); color:var(--text); font-family:'DM Mono',monospace; overflow-x:hidden; }
  body { display:flex; justify-content:center; }
  .frame { width:100%; max-width:430px; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; padding:0 16px; }

  @keyframes auraPulse   { 0%,100%{ transform:translate(-50%,-50%) scale(.92); opacity:.4; } 50%{ transform:translate(-50%,-50%) scale(1.12); opacity:.8; } }
  @keyframes heroFloat   { 0%,100%{ transform:translateY(0); opacity:.4; } 50%{ transform:translateY(-9px); opacity:.95; } }
  @keyframes sigilSpin   { to { transform:rotate(360deg); } }
  @keyframes sigilSpinR  { to { transform:rotate(-360deg); } }
  @keyframes corePulse   { 0%,100%{ transform:scale(.96); opacity:.7; } 50%{ transform:scale(1.06); opacity:1; } }
  @keyframes emberRise   { 0%{ transform:translateY(8px) scale(1); opacity:0; } 20%{ opacity:1; } 100%{ transform:translateY(-46px) scale(.3); opacity:0; } }

  /* ════ BANNER ════ */
  .banner {
    position:relative; flex-shrink:0; height:166px; margin:14px 0 0; border-radius:20px;
    background:
      radial-gradient(ellipse 60% 80% at 50% 120%, rgba(212,149,110,0.16), transparent 65%),
      linear-gradient(150deg,#26180f 0%,#341f12 48%,#1a1210 100%);
    overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; padding:0 24px 18px;
    border:1px solid rgba(212,149,110,0.10);
  }
  /* big faint sigil as backdrop, centered behind everything */
  .banner-sigil-bg {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-58%);
    width:220px; height:220px; z-index:1; opacity:0.42; pointer-events:none;
  }
  .banner-glow {
    position:absolute; top:42%; left:50%; width:240px; height:240px; z-index:0;
    background:radial-gradient(circle, rgba(255,200,150,0.16) 0%, rgba(212,149,110,0.05) 46%, transparent 70%);
    pointer-events:none; animation:auraPulse 6s ease-in-out infinite;
  }
  .sig-ring-out { animation:sigilSpin 60s linear infinite; transform-origin:110px 110px; }
  .sig-ring-in  { animation:sigilSpinR 44s linear infinite; transform-origin:110px 110px; }
  .sig-core     { animation:corePulse 5s ease-in-out infinite; transform-origin:110px 110px; }

  .banner-eyebrow { position:relative; z-index:3; font-size:8px; letter-spacing:.34em; text-transform:uppercase; color:rgba(212,168,130,.78); margin-bottom:6px; }
  .banner-title { position:relative; z-index:3; font-family:'Cormorant Garamond',serif; font-size:34px; font-weight:300; color:var(--cream); line-height:0.95; }
  .banner-meta { position:relative; z-index:3; display:flex; align-items:center; gap:10px; margin-top:10px; }
  .meta-ring { position:relative; width:30px; height:30px; flex-shrink:0; }
  .meta-ring svg { width:100%; height:100%; transform:rotate(-90deg); display:block; }
  .meta-ring b { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Cormorant Garamond',serif; font-size:13px; color:var(--cream); }
  .meta-text { font-size:9px; letter-spacing:.14em; color:rgba(232,199,156,.7); }
  .meta-text b { color:var(--gold); font-weight:500; }

  .ember { position:absolute; bottom:30px; width:3px; height:3px; border-radius:50%; background:var(--gold-soft);
    box-shadow:0 0 5px var(--gold-soft); z-index:2; opacity:0; animation:emberRise linear infinite; }

  /* ════ OMNIA FOCUS STRIP ════ */
  .focus-strip { display:flex; align-items:center; gap:10px; margin-top:12px; padding:11px 14px; border-radius:12px;
    background:rgba(212,149,110,.05); border:1px solid rgba(212,149,110,.14); }
  .focus-ico { flex-shrink:0; color:var(--copper); }
  .focus-text { font-size:9.5px; line-height:1.5; color:rgba(232,199,156,.78); }
  .focus-text b { color:var(--gold-soft); font-weight:500; }

  /* ════ CONTROLS ════ */
  .controls { display:flex; gap:8px; align-items:center; justify-content:center; padding:14px 0 14px; }
  .seg { display:flex; border:1px solid var(--border); border-radius:20px; overflow:hidden; }
  .seg button { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    background:none; border:none; color:var(--muted); padding:8px 16px; cursor:pointer; transition:all .2s; }
  .seg button.active { color:var(--gold); background:var(--copper-dim); }
  .view-toggle { width:34px; height:34px; border:1px solid var(--border); border-radius:10px; background:none; cursor:pointer;
    color:var(--muted); display:flex; align-items:center; justify-content:center; transition:all .2s; }
  .view-toggle.active { color:var(--gold); border-color:rgba(212,149,110,.4); background:var(--copper-dim); }
  .view-toggle svg { width:16px; height:16px; }

  .scroll { flex:1; overflow-y:auto; padding-bottom:40px; }

  /* ════ GRID ════ */
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .card { border:1px solid var(--border); border-radius:14px; padding:18px 16px 14px; background:var(--surface);
          cursor:pointer; transition:transform .18s, border-color .2s; position:relative; overflow:hidden;
          aspect-ratio:1; display:flex; flex-direction:column; }
  .card:hover { transform:translateY(-2px); }
  .card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--c-accent,var(--copper)); opacity:.5; }
  .card.full { aspect-ratio:auto; grid-column:1/-1; flex-direction:row; align-items:center; gap:16px; padding:16px 20px; }

  /* recommended-today highlight */
  .card.today { border-color:rgba(212,149,110,.5); box-shadow:0 0 0 1px rgba(212,149,110,.25), 0 0 22px rgba(212,149,110,.10); background:linear-gradient(180deg, rgba(212,149,110,.06), var(--surface)); }
  .today-badge { position:absolute; top:10px; right:10px; font-size:6.5px; letter-spacing:.16em; text-transform:uppercase;
    color:#1a1210; background:var(--copper); padding:2px 6px; border-radius:8px; font-weight:500; z-index:2; }

  .card-top { display:flex; align-items:flex-start; justify-content:space-between; }
  .card-ico { color:var(--c-name,var(--gold)); flex-shrink:0; }
  .card-ico svg { display:block; }
  .card-name { font-family:'Cormorant Garamond',serif; font-size:18px; color:var(--c-name,var(--gold)); margin-top:auto; }
  .card-desc { font-size:9px; line-height:1.55; color:var(--muted); margin-top:3px; }

  /* mastery pips */
  .pips { display:flex; gap:4px; margin-top:9px; }
  .pips i { width:18px; height:3px; border-radius:2px; background:rgba(255,255,255,0.08); }
  .pips i.on { background:var(--c-name,var(--gold)); box-shadow:0 0 5px var(--c-glow, rgba(212,176,142,.5)); }

  .card.full .card-name { margin-top:0; }
  .card.full .lv-body { display:flex; flex-direction:column; flex:1; }
  .card.full .pips { margin-top:7px; }

  .clock    { --c-accent:#d4956e; --c-name:#d4b08e; --c-glow:rgba(212,149,110,.5); border-color:rgba(212,149,110,.18); }
  .thought  { --c-accent:#b08ed4; --c-name:#c2a8e0; --c-glow:rgba(176,142,212,.5); border-color:rgba(176,142,212,.18); }
  .visual   { --c-accent:#6e9fd4; --c-name:#8ab8e0; --c-glow:rgba(110,159,212,.5); border-color:rgba(110,159,212,.18); }
  .auditory { --c-accent:#6eb8a4; --c-name:#8eccc0; --c-glow:rgba(110,184,164,.5); border-color:rgba(110,184,164,.18); }
  .asana    { --c-accent:#d4b08e; --c-name:#e0c79c; --c-glow:rgba(212,176,142,.5); border-color:rgba(212,176,142,.18); }
  .mirror   { --c-accent:#a8b0c4; --c-name:#c0c6d6; --c-glow:rgba(168,176,196,.5); border-color:rgba(168,176,196,.18); }

  /* list view */
  .listview { display:none; flex-direction:column; gap:10px; }
  .listview .card { aspect-ratio:auto; flex-direction:row; align-items:center; gap:16px; padding:15px 18px; }
  .listview .card:hover { transform:translateX(3px); }
  .listview .card-name { margin-top:0; }
  .listview .lv-body { display:flex; flex-direction:column; flex:1; }
  .listview .pips { margin-top:7px; }
  .frame.expanded .grid, .frame.expanded .cdots { display:none; }
  .frame.expanded .listview { display:flex; }

  .cdots { display:flex; gap:6px; justify-content:center; padding:12px 0 4px; }
  .cdots i { width:6px; height:6px; border-radius:50%; background:var(--border2); }
  .cdots i.on { background:var(--copper); }
  .footnote { text-align:center; font-size:9px; color:var(--muted); letter-spacing:.12em; margin-top:22px; line-height:1.8; }
</style>
</head>
<body>
<div class="frame" id="frame">

  <!-- ════ BANNER ════ -->
  <div class="banner">
    <div class="banner-glow"></div>
    <!-- big rotating Sulfur sigil backdrop -->
    <svg class="banner-sigil-bg" viewBox="0 0 220 220" fill="none">
      <g class="sig-ring-out" stroke="#d4956e" stroke-width="0.8" opacity="0.55">
        <circle cx="110" cy="110" r="104"/>
        <g stroke-width="1">
          <line x1="110" y1="6" x2="110" y2="16"/><line x1="110" y1="204" x2="110" y2="214"/>
          <line x1="6" y1="110" x2="16" y2="110"/><line x1="204" y1="110" x2="214" y2="110"/>
          <line x1="37" y1="37" x2="44" y2="44"/><line x1="176" y1="176" x2="183" y2="183"/>
          <line x1="183" y1="37" x2="176" y2="44"/><line x1="37" y1="183" x2="44" y2="176"/>
        </g>
      </g>
      <g class="sig-ring-in" stroke="#e8c79c" stroke-width="0.6" opacity="0.4">
        <circle cx="110" cy="110" r="80" stroke-dasharray="2 8"/>
      </g>
      <!-- Sulfur: triangle (fire/will) + cross (the elements it commands) -->
      <g class="sig-core" stroke="#e8c79c" stroke-width="1.6" stroke-linejoin="round">
        <path d="M110 64 L142 118 L78 118 Z"/>
        <line x1="110" y1="118" x2="110" y2="150"/>
        <line x1="94" y1="134" x2="126" y2="134"/>
        <circle cx="110" cy="64" r="2.5" fill="#ffe8d4" stroke="none"/>
      </g>
    </svg>

    <div class="banner-eyebrow">The Magician</div>
    <div class="banner-title">Concentration</div>
    <div class="banner-meta">
      <div class="meta-ring">
        <svg viewBox="0 0 30 30">
          <circle cx="15" cy="15" r="12" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="2.2"/>
          <circle cx="15" cy="15" r="12" fill="none" stroke="#d4956e" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="75" stroke-dashoffset="26"/>
        </svg>
        <b>7</b>
      </div>
      <div class="meta-text"><b>Adept</b> · Level 7 · 1,240 xp</div>
    </div>

    <!-- embers -->
    <div class="ember" style="left:50%; animation-duration:4s; animation-delay:0s;"></div>
    <div class="ember" style="left:46%; animation-duration:5s; animation-delay:1.4s;"></div>
    <div class="ember" style="left:54%; animation-duration:3.6s; animation-delay:2.6s;"></div>
  </div>

  <!-- ════ OMNIA FOCUS STRIP ════ -->
  <div class="focus-strip">
    <svg class="focus-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 3 L13.8 9.5 L20.5 9.5 L15.2 13.5 L17 20 L12 16 L7 20 L8.8 13.5 L3.5 9.5 L10.2 9.5 Z"/>
    </svg>
    <div class="focus-text">Omnia's focus today — <b>Clock</b> and <b>Thought Control</b>. Hold form before reaching for new gates.</div>
  </div>

  <!-- ════ CONTROLS ════ -->
  <div class="controls">
    <div class="seg">
      <button class="active" onclick="setLevel('beginner',this)">Beginner</button>
      <button onclick="setLevel('advanced',this)">Advanced</button>
    </div>
    <button class="view-toggle" id="viewBtn" onclick="toggleView(this)" title="List view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/>
      </svg>
    </button>
  </div>

  <div class="scroll" id="cardsRoot"></div>
</div>

<script>
var ICONS = {
  clock:   '<svg viewBox="0 0 32 32" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="16" cy="16" r="12"/><path d="M16 9v7l5 3"/></svg>',
  thought: '<svg viewBox="0 0 32 32" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="16" cy="16" r="12"/><circle cx="16" cy="16" r="6"/><circle cx="16" cy="16" r="1.8" fill="currentColor" stroke="none"/></svg>',
  visual:  '<svg viewBox="0 0 32 32" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 16 Q16 5 29 16 Q16 27 3 16Z"/><circle cx="16" cy="16" r="4.5"/><circle cx="16" cy="16" r="1.4" fill="currentColor" stroke="none"/></svg>',
  auditory:'<svg viewBox="0 0 32 32" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="16" r="2.6" fill="currentColor" stroke="none"/><path d="M17 11 Q21 16 17 21"/><path d="M21 8 Q27 16 21 24"/></svg>',
  asana:   '<svg viewBox="0 0 32 32" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><circle cx="16" cy="8" r="3.5"/><path d="M16 13 L7 26 L25 26 Z"/></svg>',
  mirror:  '<svg viewBox="0 0 32 32" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><ellipse cx="16" cy="15" rx="8" ry="11"/><line x1="16" y1="26" x2="16" y2="30"/><line x1="12" y1="30" x2="20" y2="30"/></svg>'
};

// [id, name, desc, masteryScore 0-3, recommendedToday]
var SETS = {
  beginner:[
    ['clock',   'Clock',          'Follow the seconds hand. Stop when focus breaks.', 3, true],
    ['thought', 'Thought Control','Hold one thought. Tap when the mind wanders.',     2, true],
    ['visual',  'Visualization',  'Hold a mental image with the eyes closed.',        1, false],
    ['auditory','Auditory',       'Sustain a single sound within the mind.',          0, false],
    ['asana',   'Asana',          'Sit in perfect stillness. Build the body of will.',1, false],
    ['mirror',  'Soul Mirror',    'Reflect. Make one honest edit today.',            -1, false]
  ],
  advanced:[
    ['clock',   'Moving Clock',   'Hold the hand while walking. Will against motion.', 2, false],
    ['visual',  'Living Image',   'Animate the image. Hold it changing without losing it.', 1, false],
    ['auditory','Inner Voice',    'Compose a sustained phrase and hold its sound.',    0, false],
    ['thought', 'Vacancy',        'Empty the mind entirely. Tap at the first intrusion.', 1, false]
  ]
};

var curLevel = 'beginner';

function pipsHTML(score) {
  if (score < 0) return ''; // Soul Mirror has no mastery track
  var out = '<div class="pips">';
  for (var i=0;i<3;i++) out += '<i' + (i < score ? ' class="on"' : '') + '></i>';
  return out + '</div>';
}

function cardHTML(ex, listMode) {
  var ico = ICONS[ex[0]] || ICONS.clock;
  var isMirror = ex[0] === 'mirror';
  var today = ex[4] ? '<div class="today-badge">Today</div>' : '';
  var cls = 'card ' + ex[0] + (isMirror ? ' full' : '') + (ex[4] ? ' today' : '');
  if (listMode || isMirror) {
    return '<div class="' + cls + '">' + today
      + '<div class="card-ico">' + ico + '</div>'
      + '<div class="lv-body"><div class="card-name">' + ex[1] + '</div><div class="card-desc">' + ex[2] + '</div>' + pipsHTML(ex[3]) + '</div></div>';
  }
  return '<div class="' + cls + '">' + today
    + '<div class="card-top"><div class="card-ico">' + ico + '</div></div>'
    + '<div class="card-name">' + ex[1] + '</div>'
    + '<div class="card-desc">' + ex[2] + '</div>'
    + pipsHTML(ex[3]) + '</div>';
}

function render() {
  var set = SETS[curLevel];
  var gridHTML = '<div class="grid">' + set.map(function(e){ return cardHTML(e, false); }).join('') + '</div>';
  var listHTML = '<div class="listview">' + set.map(function(e){ return cardHTML(e, true); }).join('') + '</div>';
  document.getElementById('cardsRoot').innerHTML = gridHTML + listHTML
    + '<div class="footnote">Mastery deepens as you practice each gate.</div>';
}
function setLevel(lv, btn) {
  curLevel = lv;
  document.querySelectorAll('.seg button').forEach(function(b){ b.classList.toggle('active', b === btn); });
  render();
}
function toggleView(btn) {
  document.getElementById('frame').classList.toggle('expanded');
  btn.classList.toggle('active');
}
render();
</script>
</body>
</html>
