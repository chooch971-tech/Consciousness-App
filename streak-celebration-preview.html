<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Streak Celebration Preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap');
  :root { --bg:#07080d; --fg:#e8e4dc; --muted:rgba(232,228,220,0.38); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font-family:'DM Mono',monospace; min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:20px; }

  .phone { width:375px; height:812px; background:var(--bg); border-radius:48px; border:2px solid rgba(255,255,255,.10); box-shadow:0 32px 80px rgba(0,0,0,.7); position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 28px 44px; }
  .phone::before { content:''; position:absolute; top:14px; left:50%; transform:translateX(-50%); width:120px; height:28px; background:#000; border-radius:20px; z-index:10; }

  .sco-bubble { background:rgba(255,255,255,0.055); border:1px solid rgba(255,255,255,0.09); border-radius:18px; padding:15px 20px; width:100%; font-size:14px; color:var(--fg); line-height:1.65; position:relative; margin-bottom:28px; z-index:2; }
  .sco-bubble::after { content:''; position:absolute; bottom:-11px; left:50%; transform:translateX(-50%); border-left:10px solid transparent; border-right:10px solid transparent; border-top:11px solid rgba(255,255,255,0.055); }
  .sco-mascot-wrap { position:relative; width:120px; height:150px; display:flex; align-items:center; justify-content:center; margin-bottom:20px; z-index:2; }
  .sco-glow { position:absolute; inset:-20%; border-radius:50%; background:radial-gradient(circle, rgba(212,149,110,0.22) 0%, rgba(212,149,110,0.08) 45%, transparent 70%); animation:scoPulse 3s ease-in-out infinite; }
  @keyframes scoPulse { 0%,100%{transform:scale(.94);opacity:.7;} 50%{transform:scale(1.06);opacity:1;} }
  .sco-num { font-family:'Cormorant Garamond',serif; font-size:90px; font-weight:300; color:#d4956e; line-height:1; margin-bottom:4px; z-index:2; }
  .sco-label { font-size:13px; letter-spacing:.08em; color:rgba(212,149,110,0.65); margin-bottom:32px; z-index:2; }
  .sco-week { display:flex; gap:10px; align-items:flex-end; margin-bottom:40px; z-index:2; }
  .sco-week-col { display:flex; flex-direction:column; align-items:center; gap:7px; }
  .sco-week-lbl { font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .sco-week-lbl.active { color:#d4956e; }
  .sco-dot { width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.05); border:1.5px solid rgba(255,255,255,0.09); display:flex; align-items:center; justify-content:center; font-size:17px; color:#fff; }
  .sco-dot.done { background:#d4956e; border-color:#d4956e; }
  .sco-dot.today { border-color:#d4956e; }
  .sco-commit-btn { background:#d4956e; color:#07080d; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.20em; text-transform:uppercase; border:none; border-radius:14px; padding:18px 40px; cursor:pointer; width:100%; z-index:2; }
  .sco-later { margin-top:14px; font-family:'DM Mono',monospace; font-size:10px; color:var(--muted); background:none; border:none; cursor:pointer; letter-spacing:.12em; text-transform:uppercase; z-index:2; }

  /* ── Animation layers ── */
  .sco-burst { position:absolute; inset:-100%; pointer-events:none; z-index:0; }
  .sco-flash { position:absolute; top:50%; left:50%; width:0; height:0; border-radius:50%; background:radial-gradient(circle, rgba(255,240,200,.95) 0%, rgba(255,200,120,.55) 30%, rgba(212,149,110,0) 70%); transform:translate(-50%,-50%); animation:scoFlash 1.1s ease-out forwards; mix-blend-mode:screen; }
  @keyframes scoFlash { 0%{width:0;height:0;opacity:0;} 12%{width:90px;height:90px;opacity:1;} 100%{width:520px;height:520px;opacity:0;} }
  .sco-shockwave { position:absolute; top:50%; left:50%; width:60px; height:60px; border-radius:50%; border:2px solid rgba(255,230,180,.7); transform:translate(-50%,-50%) scale(0); animation:scoShock 1.4s cubic-bezier(.22,.85,.4,1) forwards; }
  @keyframes scoShock { 0%{transform:translate(-50%,-50%) scale(0);opacity:0;border-width:3px;} 14%{opacity:1;} 100%{transform:translate(-50%,-50%) scale(7);opacity:0;border-width:.5px;} }
  .sco-shockwave.two { animation-delay:.18s; border-color:rgba(184,234,255,.55); }
  .sco-particle { position:absolute; top:50%; left:50%; width:6px; height:6px; border-radius:50%; transform-origin:0 0; animation:scoParticle 1.6s cubic-bezier(.18,.7,.3,1) forwards; opacity:0; }
  @keyframes scoParticle { 0%{transform:translate(-50%,-50%) rotate(var(--a)) translateX(0) scale(0);opacity:0;} 10%{opacity:1;} 60%{transform:translate(-50%,-50%) rotate(var(--a)) translateX(var(--d)) scale(1.2);opacity:1;} 100%{transform:translate(-50%,-50%) rotate(var(--a)) translateX(calc(var(--d) * 1.4)) scale(0);opacity:0;} }
  .sco-mascot-wrap.sco-anim svg { animation:scoCrystalReveal 1.4s cubic-bezier(.22,.85,.4,1) both; }
  @keyframes scoCrystalReveal { 0%{transform:scale(.2);opacity:0;filter:blur(8px) brightness(3);} 30%{transform:scale(1.45);opacity:1;filter:blur(0) brightness(2.2);} 55%{transform:scale(.92);filter:blur(0) brightness(1.4);} 100%{transform:scale(1);opacity:1;filter:blur(0) brightness(1);} }
  .sco-fadein { opacity:0; transform:translateY(8px); animation:scoFadeIn .55s ease-out forwards; }
  @keyframes scoFadeIn { to { opacity:1; transform:translateY(0); } }
  .sco-week.sco-fadein .sco-week-col { opacity:0; animation:scoFadeIn .4s ease-out forwards; }
  .sco-week.sco-fadein .sco-week-col:nth-child(1) { animation-delay:.05s; }
  .sco-week.sco-fadein .sco-week-col:nth-child(2) { animation-delay:.10s; }
  .sco-week.sco-fadein .sco-week-col:nth-child(3) { animation-delay:.15s; }
  .sco-week.sco-fadein .sco-week-col:nth-child(4) { animation-delay:.20s; }
  .sco-week.sco-fadein .sco-week-col:nth-child(5) { animation-delay:.25s; }
  .sco-week.sco-fadein .sco-week-col:nth-child(6) { animation-delay:.30s; }
  .sco-week.sco-fadein .sco-week-col:nth-child(7) { animation-delay:.35s; }

  /* controls */
  .controls { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; max-width:600px; padding:0 16px; }
  .ctrl-btn { background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12); color:var(--fg); font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; padding:10px 20px; border-radius:8px; cursor:pointer; }
  .ctrl-btn.primary { background:#d4956e; color:#07080d; border-color:#d4956e; }
  .ctrl-btn:hover { opacity:.85; }
  .ctrl-label { color:var(--muted); font-family:'DM Mono',monospace; font-size:9px; letter-spacing:.2em; text-transform:uppercase; align-self:center; }
</style>
</head>
<body>

<div class="phone" id="phone"></div>

<div class="controls">
  <button class="ctrl-btn primary" onclick="replay()">▶ Replay (with sound)</button>
  <span class="ctrl-label">Streak:</span>
  <button class="ctrl-btn" onclick="render(1)">Day 1</button>
  <button class="ctrl-btn" onclick="render(2)">Day 2</button>
  <button class="ctrl-btn" onclick="render(7)">Day 7</button>
  <button class="ctrl-btn" onclick="render(30)">Day 30</button>
</div>

<script>
  var DAY_LABELS = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  var MESSAGES = {
    1:  'Day one. The hardest step is done.',
    2:  'I knew you\'d come back. Let\'s do this again tomorrow.',
    7:  'Seven days. A real habit is forming.',
    30: 'Thirty days. You\'ve become someone who meditates.',
  };
  function getMessage(s) {
    if (MESSAGES[s]) return MESSAGES[s];
    return ['Consistency is the highest discipline.','The work compounds. Every session counts.','Your mind is changing. You can feel it.'][(s-1)%3];
  }

  var crystalSVG = '<svg viewBox="0 0 80 130" width="86" height="126" xmlns="http://www.w3.org/2000/svg" style="filter:drop-shadow(0 0 12px rgba(184,234,255,.4)) drop-shadow(0 0 24px rgba(184,234,255,.2))">'
    + '<defs><linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ddf0ff" stop-opacity=".92"/><stop offset="100%" stop-color="#6ab8d8" stop-opacity=".48"/></linearGradient><linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ffffff" stop-opacity=".78"/><stop offset="100%" stop-color="#4a9ec0" stop-opacity=".22"/></linearGradient><radialGradient id="g3" cx="50%" cy="38%" r="58%"><stop offset="0%" stop-color="#b8eaff" stop-opacity=".42"/><stop offset="100%" stop-color="#2878a0" stop-opacity="0"/></radialGradient></defs>'
    + '<ellipse cx="40" cy="68" rx="28" ry="48" fill="url(#g3)" opacity=".62"/>'
    + '<polygon points="40,3 54,14 40,25 26,14" fill="url(#g1)" stroke="#90cce8" stroke-width=".55"/>'
    + '<polygon points="40,3 54,14 40,13" fill="#ceeaff" opacity=".72"/>'
    + '<polygon points="40,3 26,14 40,13" fill="#b0dcf5" opacity=".42"/>'
    + '<polygon points="40,25 60,36 64,58 40,70 16,58 20,36" fill="url(#g1)" stroke="#88c4e0" stroke-width=".55"/>'
    + '<polygon points="40,25 60,36 40,44" fill="#d4ecff" opacity=".52"/>'
    + '<polygon points="40,25 20,36 40,44" fill="#bce0f8" opacity=".32"/>'
    + '<polygon points="40,70 64,58 56,88 40,100 24,88 16,58" fill="url(#g1)" stroke="#88c4e0" stroke-width=".55" opacity=".88"/>'
    + '<polygon points="40,100 56,88 40,114" fill="url(#g2)" stroke="#88c4e0" stroke-width=".48" opacity=".72"/>'
    + '<polygon points="40,100 24,88 40,114" fill="#b4dcf4" stroke="#88c4e0" stroke-width=".48" opacity=".52"/>'
    + '</svg>';

  function buildWeek(s) {
    var dow = new Date().getDay();
    var practicedCount = Math.min(s, dow + 1);
    return DAY_LABELS.map(function(lbl, i) {
      var isToday = i === dow;
      var isFuture = i > dow;
      var isPracticed = !isFuture && i >= (dow - practicedCount + 1);
      return '<div class="sco-week-col">'
        + '<div class="sco-week-lbl' + (isToday ? ' active' : '') + '">' + lbl + '</div>'
        + '<div class="sco-dot' + (isPracticed ? ' done' : isToday ? ' today' : '') + '">' + (isPracticed ? '✓' : '') + '</div>'
        + '</div>';
    }).join('');
  }

  var currentStreak = 2;

  function render(s) {
    currentStreak = s;
    var phone = document.getElementById('phone');

    // Build burst HTML
    var burstHTML = '<div class="sco-burst"><div class="sco-flash"></div><div class="sco-shockwave"></div><div class="sco-shockwave two"></div>';
    var colors = ['#fff0c8','#b8eaff','#d4956e','#e8d8b0','#a8d8ec','#ffe2a0'];
    for (var i = 0; i < 18; i++) {
      var a = (i / 18) * 360 + (Math.random() * 12 - 6);
      var d = 140 + Math.random() * 100;
      var c = colors[i % colors.length];
      var del = Math.random() * 0.15;
      var sz = 4 + Math.random() * 5;
      burstHTML += '<div class="sco-particle" style="--a:' + a + 'deg;--d:' + d + 'px;width:' + sz + 'px;height:' + sz + 'px;background:' + c + ';box-shadow:0 0 8px ' + c + ',0 0 14px ' + c + ';animation-delay:' + del + 's;"></div>';
    }
    burstHTML += '</div>';

    phone.innerHTML = burstHTML
      + '<div class="sco-bubble sco-fadein" style="animation-delay:.55s">' + getMessage(s) + '</div>'
      + '<div class="sco-mascot-wrap sco-anim"><div class="sco-glow"></div>' + crystalSVG + '</div>'
      + '<div class="sco-num sco-fadein" style="animation-delay:.65s">' + s + '</div>'
      + '<div class="sco-label sco-fadein" style="animation-delay:.72s">day streak</div>'
      + '<div class="sco-week sco-fadein" style="animation-delay:.80s">' + buildWeek(s) + '</div>'
      + '<button class="sco-commit-btn sco-fadein" style="animation-delay:1.15s">I\'m Committed →</button>'
      + '<button class="sco-later sco-fadein" style="animation-delay:1.25s">Continue</button>';

    playStreakBurstSound();
  }

  function replay() { render(currentStreak); }

  function playStreakBurstSound() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var t0 = ctx.currentTime;
      var sub = ctx.createOscillator(), subG = ctx.createGain();
      sub.type = 'sine'; sub.frequency.setValueAtTime(120, t0); sub.frequency.exponentialRampToValueAtTime(40, t0 + 0.45);
      subG.gain.setValueAtTime(0, t0); subG.gain.linearRampToValueAtTime(0.32, t0 + 0.02); subG.gain.exponentialRampToValueAtTime(0.001, t0 + 0.6);
      sub.connect(subG); subG.connect(ctx.destination); sub.start(t0); sub.stop(t0 + 0.7);
      var noise = ctx.createBufferSource();
      var buf = ctx.createBuffer(1, ctx.sampleRate * 0.8, ctx.sampleRate);
      var data = buf.getChannelData(0);
      for (var n = 0; n < data.length; n++) data[n] = (Math.random() * 2 - 1) * (1 - n / data.length);
      noise.buffer = buf;
      var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.8;
      bp.frequency.setValueAtTime(400, t0); bp.frequency.exponentialRampToValueAtTime(5000, t0 + 0.7);
      var noiseG = ctx.createGain(); noiseG.gain.setValueAtTime(0, t0); noiseG.gain.linearRampToValueAtTime(0.18, t0 + 0.1); noiseG.gain.exponentialRampToValueAtTime(0.001, t0 + 0.8);
      noise.connect(bp); bp.connect(noiseG); noiseG.connect(ctx.destination); noise.start(t0);
      [261.63, 392.00, 523.25, 659.25, 783.99, 1046.50].forEach(function(freq, i) {
        var delay = 0.35 + i * 0.06;
        var osc = ctx.createOscillator(), osc2 = ctx.createOscillator(), g = ctx.createGain();
        osc.type = 'sine'; osc2.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t0 + delay);
        osc2.frequency.setValueAtTime(freq * 2.005, t0 + delay);
        g.gain.setValueAtTime(0, t0 + delay);
        g.gain.linearRampToValueAtTime(i >= 4 ? 0.13 : 0.09, t0 + delay + 0.04);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + delay + 2.8);
        osc.connect(g); osc2.connect(g); g.connect(ctx.destination);
        osc.start(t0 + delay); osc.stop(t0 + delay + 3);
        osc2.start(t0 + delay); osc2.stop(t0 + delay + 3);
      });
      [1567, 2093, 2637, 3136, 2349].forEach(function(freq, i) {
        var delay = 0.55 + i * 0.08;
        var osc = ctx.createOscillator(), g = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(freq, t0 + delay);
        g.gain.setValueAtTime(0, t0 + delay);
        g.gain.linearRampToValueAtTime(0.06, t0 + delay + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + delay + 0.7);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(t0 + delay); osc.stop(t0 + delay + 0.8);
      });
    } catch(e) {}
  }

  render(2);
</script>
</body>
</html>
