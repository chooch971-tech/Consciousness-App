<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Presence · Welcome — Omnia (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#07080d; --surface:#0e0f17;
    --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
    --text:#ddd8ce; --muted:rgba(221,216,206,0.38);
    --accent:#7eb8a4; --accent2:#a4c4b8; --accent-dim:rgba(126,184,164,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'DM Mono',monospace;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .phone{
    position:relative; width:min(420px,100vw); height:min(900px,100vh);
    background:radial-gradient(ellipse 60% 40% at 50% 40%, rgba(126,184,164,0.07) 0%, var(--bg) 70%);
    display:flex; flex-direction:column;
    padding:0 30px env(safe-area-inset-bottom) 30px; overflow:hidden;
  }
  .ambient{
    position:absolute; top:34%; left:50%; transform:translate(-50%,-50%);
    width:320px; height:320px; pointer-events:none;
    background:radial-gradient(circle, rgba(184,234,255,0.10) 0%, rgba(126,184,164,0.05) 38%, transparent 70%);
    filter:blur(6px); animation:breathe 7s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform:translate(-50%,-50%) scale(1); opacity:.85; }
    50%{ transform:translate(-50%,-50%) scale(1.12); opacity:1; }
  }

  .hero{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }

  /* crystal stage with floating beads, as in-app */
  .crystal-stage{
    position:relative; width:140px; height:200px;
    display:flex; align-items:center; justify-content:center;
    animation:float 6s ease-in-out infinite; margin-bottom:30px;
  }
  @keyframes float{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-9px);} }
  .omnia-crystal{
    width:112px; height:auto; overflow:visible; position:relative; z-index:2;
    filter:drop-shadow(0 0 16px rgba(184,234,255,0.40)) drop-shadow(0 0 5px rgba(184,234,255,0.5));
  }
  .bead{
    position:absolute; border-radius:50%; background:#cdeeff;
    box-shadow:0 0 6px rgba(184,234,255,.8);
    opacity:0; animation:beadFloat 4s ease-in-out infinite;
  }
  @keyframes beadFloat{
    0%,100%{ transform:translateY(4px); opacity:0; }
    35%,65%{ transform:translateY(-6px); opacity:.85; }
  }

  /* exact Presence wordmark styling from the app splash */
  .wordmark{
    /* matches the in-app #splash wordmark, at the app's fuller weight */
    font-family:'Cormorant Garamond',serif; font-weight:400; font-size:48px;
    letter-spacing:0.14em; color:#e8e0d0; line-height:1; margin:0;
  }
  .tagline{
    margin-top:18px; font-family:'DM Mono',monospace; font-size:9px;
    letter-spacing:0.32em; text-transform:uppercase; color:rgba(221,216,206,0.58);
  }

  .actions{ display:flex; flex-direction:column; gap:13px; padding-bottom:10px; }
  .btn{
    position:relative; overflow:hidden; width:100%; padding:21px 24px; border-radius:18px; cursor:pointer;
    font-family:'DM Mono',monospace; font-size:11.5px; letter-spacing:.22em; font-weight:400;
    text-transform:uppercase; transition:transform .14s ease, box-shadow .3s ease, filter .2s ease, border-color .2s;
    border:1px solid transparent;
  }
  .btn:active{ transform:translateY(1px) scale(.99); }
  /* glossy top sheen on the filled button */
  .btn--primary::before{
    content:''; position:absolute; left:0; right:0; top:0; height:52%;
    background:linear-gradient(180deg, rgba(255,255,255,.38), rgba(255,255,255,0));
    pointer-events:none;
  }
  .btn--primary{
    background:linear-gradient(180deg, #b6e6d6 0%, #74b59f 100%);
    border-color:rgba(255,255,255,.32); color:#06241d;
    text-shadow:0 1px 0 rgba(255,255,255,.25);
    animation:glow 3.6s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{ box-shadow:0 10px 26px rgba(116,181,159,.30), inset 0 1px 0 rgba(255,255,255,.4); }
    50%{ box-shadow:0 14px 34px rgba(142,204,224,.52), inset 0 1px 0 rgba(255,255,255,.5); }
  }
  .btn--primary:hover{ filter:brightness(1.05) saturate(1.05); }
  .btn--ghost{
    background:linear-gradient(180deg, rgba(184,234,255,.12), rgba(184,234,255,.045));
    border-color:rgba(184,234,255,.30); color:#cfeaf5;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  }
  .btn--ghost:hover{ background:linear-gradient(180deg, rgba(184,234,255,.18), rgba(184,234,255,.08)); border-color:rgba(184,234,255,.5); color:#e6f6ff; }

  .toast{
    position:absolute; left:50%; bottom:132px; transform:translateX(-50%) translateY(12px);
    background:var(--surface); border:1px solid var(--border2); color:var(--text);
    padding:12px 18px; border-radius:12px; font-size:11px; letter-spacing:.06em;
    opacity:0; pointer-events:none; transition:opacity .3s, transform .3s; white-space:nowrap;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast b{ color:var(--accent2); font-weight:400; }
</style>
</head>
<body>
  <div class="phone">
    <div class="ambient"></div>

    <div class="hero">
      <div class="crystal-stage" id="stage">
        <!-- The real Omnia crystal, lifted straight from the app -->
        <svg class="omnia-crystal" viewBox="0 0 72 118" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <radialGradient id="tpg3" cx="50%" cy="40%" r="60%">
              <stop offset="0%" stop-color="#e8f8ff" stop-opacity=".55"/>
              <stop offset="100%" stop-color="#8ecce0" stop-opacity="0"/>
            </radialGradient>
            <filter id="tpgl"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <ellipse cx="36" cy="62" rx="24" ry="42" fill="url(#tpg3)" filter="url(#tpgl)" opacity=".55"/>
          <polygon points="36,2 50,14 36,26 22,14" fill="#ceeaff" stroke="#90cce8" stroke-width=".8" opacity=".95"/>
          <polygon points="36,2 50,14 36,13" fill="#e8f8ff" opacity=".55"/>
          <polygon points="36,2 22,14 36,13" fill="#b4daf5" opacity=".35"/>
          <line x1="36" y1="2" x2="36" y2="26" stroke="#b8e0f8" stroke-width=".5" opacity=".4"/>
          <polygon points="36,26 56,37 60,59 36,70 12,59 16,37" fill="#b8dcf5" stroke="#88c4e0" stroke-width=".7" opacity=".88"/>
          <polygon points="36,26 56,37 36,45" fill="#d4ecff" opacity=".44"/>
          <polygon points="36,26 16,37 36,45" fill="#a8d4f0" opacity=".28"/>
          <line x1="36" y1="26" x2="36" y2="70" stroke="#a8d8f2" stroke-width=".5" opacity=".38"/>
          <polygon points="36,70 60,59 52,88 36,100 20,88 12,59" fill="#a8d4f0" stroke="#88c4e0" stroke-width=".7" opacity=".82"/>
          <polygon points="36,100 52,88 36,116" fill="#98c8e8" stroke="#88c4e0" stroke-width=".6" opacity=".7"/>
          <polygon points="36,100 20,88 36,116" fill="#88c0e0" stroke="#88c4e0" stroke-width=".6" opacity=".52"/>
        </svg>
      </div>

      <h1 class="wordmark">Presence</h1>
      <div class="tagline">Enlightenment now</div>
    </div>

    <div class="actions">
      <button class="btn btn--primary" onclick="tap('Begin')">Begin the Practice</button>
      <button class="btn btn--ghost" onclick="tap('Sign in')">I already have an account</button>
    </div>

    <div class="toast" id="toast"></div>
  </div>

<script>
  // scatter the floating beads around the crystal, as in-app
  var beads=[
    [24,18,0,6],[37,10,.22,5],[52,14,.44,8],[68,8,.66,5],
    [78,24,.88,7],[18,35,1.1,5],[34,30,1.32,7],[58,34,1.54,6],
    [72,42,1.76,5],[27,50,1.98,8],[46,46,2.2,5],[64,56,2.42,7]
  ];
  var stage=document.getElementById('stage');
  beads.forEach(function(p){
    var b=document.createElement('span');
    b.className='bead';
    b.style.left=p[0]+'%'; b.style.top=p[1]+'%';
    b.style.width=p[3]+'px'; b.style.height=p[3]+'px';
    b.style.animationDelay=p[2]+'s';
    stage.appendChild(b);
  });

  var t=document.getElementById('toast'), timer;
  function tap(which){
    t.innerHTML = which==='Begin'
      ? '→ Would open the <b>tutorial / first session</b>'
      : '→ Would open <b>Continue with Google</b>';
    t.classList.add('show');
    clearTimeout(timer);
    timer=setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }
</script>
</body>
</html>
