<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Awareness — Rose Cross banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#07080d; --surface:#0e0f17; --surface2:#13141f;
    --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
    --text:#ddd8ce; --muted:rgba(221,216,206,0.38);
    --accent:#7eb8a4; --accent2:#a4c4b8; --accent-dim:rgba(126,184,164,0.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:var(--bg); color:var(--text); font-family:'DM Mono',monospace; overflow:hidden; }
  body { display:flex; justify-content:center; height:100%; }
  .frame { width:100%; max-width:430px; height:100vh; height:100dvh; background:var(--bg); display:flex; flex-direction:column; padding:0 20px; overflow:hidden; }

  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  @keyframes ripple    { 0%{ transform:scale(.5); opacity:.5; } 70%{ opacity:.1; } 100%{ transform:scale(1.3); opacity:0; } }
  @keyframes glowPulse { 0%,100%{ opacity:.5; } 50%{ opacity:1; } }
  @keyframes heroFloat { 0%,100%{ transform:translateY(0); opacity:.45; } 50%{ transform:translateY(-7px); opacity:.9; } }
  @keyframes eyePulse  { 0%,100%{ transform:scale(.93); filter:drop-shadow(0 0 5px rgba(126,184,164,.38)) drop-shadow(0 0 14px rgba(126,184,164,.15)); }
                         50%   { transform:scale(1.05); filter:drop-shadow(0 0 12px rgba(126,184,164,.72)) drop-shadow(0 0 26px rgba(126,184,164,.30)); } }
  @keyframes symPulse  { 0%,100%{ opacity:.7; } 50%{ opacity:1; } }

  /* top bar + tabs (context, mirrors app) */
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:10px 0 8px; }
  .hamburger { display:flex; flex-direction:column; gap:4px; cursor:pointer; }
  .hamburger span { width:20px; height:1.5px; background:var(--muted); display:block; }
  .wordmark { font-family:'Cormorant Garamond',serif; font-size:13px; font-weight:300; letter-spacing:.35em; text-transform:uppercase; color:var(--accent); }
  .streak { font-size:10px; letter-spacing:.12em; color:var(--muted); }
  .streak b { color:var(--accent); font-weight:400; }
  .tabs { display:flex; gap:18px; justify-content:center; border-bottom:1px solid var(--border); padding-bottom:14px; margin-bottom:2px; }
  .tab { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); position:relative; padding-bottom:14px; margin-bottom:-15px; }
  .tab.active { color:var(--accent); border-bottom:1.5px solid var(--accent); }

  /* ===== GREEN BANNER — rank lives here (like Concentration) ===== */
  .banner { position:relative; flex-shrink:0; height:134px; margin:10px 0 4px; border-radius:18px; overflow:hidden;
    background:linear-gradient(145deg, #0c2a1e 0%, #113828 42%, #0c2218 100%);
    display:flex; align-items:center; justify-content:space-between; padding:0 22px; }
  .banner::before { content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 60% 70% at 72% 55%, rgba(90,210,150,.26) 0%, transparent 70%); }
  .banner::after  { content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 40% 50% at 68% 48%, rgba(170,255,215,.12) 0%, transparent 60%); }
  .banner-text { z-index:3; display:flex; flex-direction:column; gap:3px; }
  .banner-label { font-size:8px; letter-spacing:.28em; text-transform:uppercase; color:rgba(142,220,184,.78); }
  .banner-title { font-family:'Cormorant Garamond',serif; font-size:25px; font-weight:300; color:#d8fff4; line-height:1.1; }
  /* rank sub-line — same pattern as Concentration banner */
  .banner-sub { display:inline-flex; align-items:center; gap:6px; margin-top:1px;
    font-size:9px; letter-spacing:.1em; color:rgba(200,245,225,.48); cursor:pointer;
    padding:3px 6px 3px 0; border-radius:8px; transition:color .18s; align-self:flex-start; }
  .banner-sub:hover { color:rgba(200,255,230,.75); }
  .banner-sub svg { flex-shrink:0; animation:symPulse 5s ease-in-out infinite; }

  .banner-right { position:relative; z-index:2; width:128px; height:134px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .banner-glow { position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle, rgba(126,220,180,0.20) 0%, rgba(126,184,164,0.07) 42%, transparent 70%); animation:glowPulse 5s ease-in-out infinite; }
  .ripple { position:absolute; left:50%; top:50%; border-radius:50%; border:1px solid rgba(164,210,184,.4);
    width:104px; height:104px; margin:-52px 0 0 -52px; animation:ripple 5s ease-out infinite; }
  .ripple:nth-child(3){ animation-delay:1.7s; }
  .ripple:nth-child(4){ animation-delay:3.4s; }
  .banner-symbol { position:relative; z-index:3; animation:eyePulse 5s ease-in-out infinite; transform-origin:center; }
  .dots-bg { position:absolute; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
  .dots-bg > i { position:absolute; border-radius:50%; background:rgba(180,230,210,.48); animation:heroFloat 4.5s ease-in-out infinite; }

  /* ===== BODY ===== */
  .hero { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:16px; padding-top:4px; opacity:0; animation:fadeUp .7s ease forwards .25s; }
  .level-ring { position:relative; width:140px; height:140px; cursor:pointer; flex-shrink:0; }
  .level-ring svg { width:140px; height:140px; transform:rotate(-90deg); }
  .ring-track { fill:none; stroke:var(--border2); stroke-width:1; }
  .ring-prog { fill:none; stroke:var(--accent); stroke-width:1.5; stroke-linecap:round; }
  .ring-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; }
  .ring-level-num { font-family:'Cormorant Garamond',serif; font-size:36px; font-weight:300; color:var(--text); line-height:1; }
  .ring-level-sub { font-size:8px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }

  .next-session { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 18px; width:100%; max-width:300px; align-self:center; flex-shrink:0; }
  .next-row { display:flex; justify-content:space-between; align-items:center; }
  .next-key { font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }
  .next-val { font-size:12px; color:var(--text); min-width:60px; text-align:center; }
  .nudge { width:30px; height:30px; border-radius:50%; border:1px solid rgba(126,184,164,.25); background:rgba(126,184,164,.06);
    color:var(--accent); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:'DM Mono',monospace; }

  .home-actions { display:flex; flex-direction:column; gap:10px; opacity:0; animation:fadeUp .7s ease forwards .4s; padding-bottom:22px; }
  .btn { width:100%; padding:15px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text);
    font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.25em; text-transform:uppercase; cursor:pointer; transition:all .2s; }
  /* bright primary + bright secondary */
  .btn.primary { background:var(--accent); border:none; color:#07080d; font-weight:400; box-shadow:0 4px 18px rgba(126,184,164,.30); }
  .btn.primary:active { opacity:.9; }
  .btn.bright { background:rgba(126,184,164,.14); border:1px solid rgba(126,184,164,.5); color:#c4e0d4; }
  .btn.ghost { background:transparent; border:none; color:var(--muted); font-size:10px; }
</style>
</head>
<body>
<div class="frame">

  <!-- top bar + tabs (context) -->
  <div class="topbar">
    <div class="hamburger"><span></span><span></span><span></span></div>
    <div class="wordmark">Presence</div>
    <div class="streak">streak <b>2d</b></div>
  </div>
  <div class="tabs">
    <span class="tab">Guide</span>
    <span class="tab">Concentration</span>
    <span class="tab active">Awareness ▾</span>
  </div>

  <!-- ===== GREEN BANNER ===== -->
  <div class="banner">
    <div class="banner-text">
      <div class="banner-label">The Witness</div>
      <div class="banner-title">Awareness</div>
      <div class="banner-sub" title="Tap for rank details">
        <svg width="14" height="14" viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="46" fill="none" stroke="#cfe8da" stroke-width="3.5" opacity="0.85"/>
          <path d="M50 4 A46 46 0 0 1 50 96 A23 23 0 0 1 50 50 A23 23 0 0 0 50 4" fill="#cfe8da" opacity="0.85"/>
          <circle cx="50" cy="27" r="8" fill="#0c2218"/>
          <circle cx="50" cy="73" r="8" fill="#cfe8da"/>
        </svg>
        Initiate · 0 xp
      </div>
    </div>
    <div class="banner-right">
      <div class="banner-glow"></div>
      <div class="ripple"></div><div class="ripple"></div><div class="ripple"></div>
      <!-- thirdeye — triangle of awareness with inner eye -->
      <svg class="banner-symbol" width="76" height="76" viewBox="0 0 100 100" fill="none">
        <polygon points="50,10 92,80 8,80" stroke="#c4e0d4" stroke-width="2" fill="none" opacity="0.85"/>
        <polygon points="50,26 76,74 24,74" stroke="#c4e0d4" stroke-width="1" fill="none" opacity="0.38"/>
        <circle cx="50" cy="58" r="10" stroke="#c4e0d4" stroke-width="1.8" fill="none" opacity="0.8"/>
        <circle cx="50" cy="58" r="4.5" fill="#c4e0d4" opacity="0.92"/>
        <line x1="50" y1="10" x2="50" y2="2" stroke="#c4e0d4" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
      </svg>
    </div>
    <div class="dots-bg">
      <i style="width:5px;height:5px;left:24%;top:24%;animation-delay:.3s;"></i>
      <i style="width:4px;height:4px;left:30%;top:70%;animation-delay:1.8s;"></i>
    </div>
  </div>

  <!-- ===== BODY ===== -->
  <div class="hero">
    <div class="level-ring" title="Tap for rank details">
      <svg viewBox="0 0 140 140">
        <circle class="ring-track" cx="70" cy="70" r="60"/>
        <circle class="ring-prog" cx="70" cy="70" r="60" stroke-dasharray="377" stroke-dashoffset="372"/>
      </svg>
      <div class="ring-center">
        <div class="ring-level-num">I</div>
        <div class="ring-level-sub">Initiate</div>
      </div>
    </div>

    <div class="next-session">
      <div class="next-row">
        <span class="next-key">session duration</span>
        <div style="display:flex; align-items:center; gap:8px;">
          <button class="nudge">−</button>
          <span class="next-val">30m</span>
          <button class="nudge">+</button>
        </div>
      </div>
      <div style="height:12px"></div>
      <div class="next-row">
        <span class="next-key">reminder every</span>
        <div style="display:flex; align-items:center; gap:8px;">
          <button class="nudge">−</button>
          <span class="next-val">1m 30s</span>
          <button class="nudge">+</button>
        </div>
      </div>
    </div>
  </div>

  <div class="home-actions">
    <button class="btn primary">Begin Session</button>
    <button class="btn bright">View History</button>
    <button class="btn ghost">About</button>
  </div>

</div>
</body>
</html>
