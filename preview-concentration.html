<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Concentration — The Magician</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#07080d; --surface:#0e0f17; --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
    --text:#ddd8ce; --muted:rgba(221,216,206,0.38);
    --copper:#d4956e; --gold:#d4b08e; --gold-soft:#e8c79c; --cream:#ffe8d4; --copper-dim:rgba(212,149,110,0.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:var(--bg); color:var(--text); font-family:'DM Mono',monospace; overflow-x:hidden; }
  body { display:flex; justify-content:center; }
  .frame { width:100%; max-width:430px; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; padding:0 16px; }

  @keyframes auraPulse   { 0%,100%{ transform:translateY(-50%) scale(.92); opacity:.45; } 50%{ transform:translateY(-50%) scale(1.1); opacity:.85; } }
  @keyframes heroFloat   { 0%,100%{ transform:translateY(0); opacity:.5; } 50%{ transform:translateY(-8px); opacity:1; } }
  @keyframes sigilSpin   { to { transform:rotate(360deg); } }
  @keyframes sigilGlow   { 0%,100%{ opacity:.55; } 50%{ opacity:.9; } }
  @keyframes innerPulse  { 0%,100%{ transform:scale(.94); opacity:.5; } 50%{ transform:scale(1.08); opacity:.85; } }

  /* ── BANNER ── */
  .banner {
    position:relative; flex-shrink:0; height:138px; margin:14px 0 0;
    border-radius:18px;
    background:linear-gradient(145deg,#241710 0%,#301d12 45%,#1c1410 100%);
    overflow:hidden; display:flex; align-items:center; padding:0 0 0 26px;
  }
  .banner::before { content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 55% 70% at 78% 52%, rgba(212,149,110,.22) 0%, transparent 70%); }

  /* left text */
  .banner-text { z-index:3; display:flex; flex-direction:column; gap:5px; }
  .banner-label { font-size:8px; letter-spacing:.30em; text-transform:uppercase; color:rgba(212,168,130,.75); }
  .banner-title { font-family:'Cormorant Garamond',serif; font-size:30px; font-weight:300; color:var(--cream); line-height:1; }

  /* right sigil area */
  .banner-sigil-wrap {
    position:absolute; right:0; top:0; bottom:0; width:185px;
    display:flex; align-items:center; justify-content:center; z-index:2;
  }
  /* radial glow behind sigil */
  .banner-glow {
    position:absolute; right:6px; top:50%; width:170px; height:170px; transform:translateY(-50%);
    background:radial-gradient(circle, rgba(255,200,150,0.20) 0%, rgba(212,149,110,0.07) 45%, transparent 70%);
    pointer-events:none; animation:auraPulse 5s ease-in-out infinite;
  }

  /* The sigil: alchemical Sulfur (upward triangle + cross) = active will / The Magician */
  .sigil-svg { position:relative; z-index:3; animation:sigilGlow 5s ease-in-out infinite; }
  .sigil-ring-outer { animation:sigilSpin 48s linear infinite; transform-origin:center; }
  .sigil-core { animation:innerPulse 5s ease-in-out infinite; transform-origin:center; }

  /* ambient dots */
  .dots-bg { position:absolute; inset:0; pointer-events:none; z-index:1; }
  .dots-bg > i { position:absolute; border-radius:50%; background:rgba(255,210,170,.45); animation:heroFloat 4.5s ease-in-out infinite; }

  /* ── LEVEL PILL (below banner, right-aligned) ── */
  .level-row { display:flex; justify-content:flex-end; padding:8px 2px 4px; }
  .level-pill {
    display:flex; align-items:center; gap:8px;
    border:1px solid rgba(212,149,110,.22); border-radius:20px;
    padding:6px 14px 6px 8px; background:rgba(212,149,110,.06);
  }
  .level-ring-mini { position:relative; width:34px; height:34px; flex-shrink:0; }
  .level-ring-mini svg { width:100%; height:100%; transform:rotate(-90deg); display:block; }
  .level-ring-mini .lrm-num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Cormorant Garamond',serif; font-size:14px; font-weight:300; color:var(--cream); }
  .level-pill-text { display:flex; flex-direction:column; }
  .level-pill-text b { font-family:'Cormorant Garamond',serif; font-size:15px; font-weight:400; color:var(--gold); line-height:1.1; }
  .level-pill-text span { font-size:8px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-top:2px; }

  /* ── CONTROLS ── */
  .controls { display:flex; gap:8px; align-items:center; justify-content:center; padding:12px 0 14px; }
  .seg { display:flex; border:1px solid var(--border); border-radius:20px; overflow:hidden; }
  .seg button { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    background:none; border:none; color:var(--muted); padding:8px 16px; cursor:pointer; transition:all .2s; }
  .seg button.active { color:var(--gold); background:var(--copper-dim); }
  .view-toggle { width:34px; height:34px; border:1px solid var(--border); border-radius:10px; background:none; cursor:pointer;
    color:var(--muted); display:flex; align-items:center; justify-content:center; transition:all .2s; }
  .view-toggle.active { color:var(--gold); border-color:rgba(212,149,110,.4); background:var(--copper-dim); }
  .view-toggle svg { width:16px; height:16px; }

  /* ── SCROLL + GRID ── */
  .scroll { flex:1; overflow-y:auto; padding-bottom:40px; }

  /* square 2×3 grid */
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .card { border:1px solid var(--border); border-radius:14px; padding:20px 16px 18px; background:var(--surface);
          cursor:pointer; transition:transform .18s; position:relative; overflow:hidden; aspect-ratio:1; display:flex; flex-direction:column; }
  .card:hover { transform:translateY(-2px); }
  .card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--c-accent,var(--copper)); opacity:.5; }
  .card.full { aspect-ratio:auto; grid-column:1/-1; flex-direction:row; align-items:center; gap:16px; padding:18px 20px; }
  .card-ico { color:var(--c-name,var(--gold)); flex-shrink:0; margin-bottom:auto; }
  .card-ico svg { display:block; }
  .card-name { font-family:'Cormorant Garamond',serif; font-size:18px; color:var(--c-name,var(--gold)); margin-top:12px; }
  .card-desc { font-size:9px; line-height:1.6; color:var(--muted); margin-top:4px; }
  .card.full .card-ico { margin-bottom:0; }
  .card.full .card-name { margin-top:0; }
  .card.full .lv-body { display:flex; flex-direction:column; }
  .clock    { --c-accent:#d4956e; --c-name:#d4b08e; border-color:rgba(212,149,110,.18); }
  .thought  { --c-accent:#b08ed4; --c-name:#c2a8e0; border-color:rgba(176,142,212,.18); }
  .visual   { --c-accent:#6e9fd4; --c-name:#8ab8e0; border-color:rgba(110,159,212,.18); }
  .auditory { --c-accent:#6eb8a4; --c-name:#8eccc0; border-color:rgba(110,184,164,.18); }
  .asana    { --c-accent:#d4b08e; --c-name:#e0c79c; border-color:rgba(212,176,142,.18); }
  .mirror   { --c-accent:#a8b0c4; --c-name:#c0c6d6; border-color:rgba(168,176,196,.18); }

  /* list view (expanded) */
  .listview { display:none; flex-direction:column; gap:10px; }
  .listview .card { aspect-ratio:auto; flex-direction:row; align-items:center; gap:16px; padding:16px 18px; }
  .listview .card:hover { transform:translateX(3px); }
  .listview .card .card-ico { margin-bottom:0; }
  .listview .card .card-name { margin-top:0; }
  .listview .lv-body { display:flex; flex-direction:column; }
  .frame.expanded .grid, .frame.expanded .cdots { display:none; }
  .frame.expanded .listview { display:flex; }

  /* carousel dots */
  .cdots { display:flex; gap:6px; justify-content:center; padding:10px 0 4px; }
  .cdots i { width:6px; height:6px; border-radius:50%; background:var(--border2); transition:background .2s; }
  .cdots i.on { background:var(--copper); }

  .footnote { text-align:center; font-size:9px; color:var(--muted); letter-spacing:.12em; margin-top:22px; line-height:1.8; }
</style>
</head>
<body>
<div class="frame" id="frame">

  <!-- ══ BANNER ══ -->
  <div class="banner">
    <div class="banner-text">
      <div class="banner-label">The Magician</div>
      <div class="banner-title">Concentration</div>
    </div>

    <div class="banner-sigil-wrap">
      <div class="banner-glow"></div>
      <!--
        Alchemical Sulfur sigil: upward triangle (fire / active will) + cross below.
        In Bardon's Hermetics, Sulfur = the active, fiery masculine principle —
        the will the Magician forges. No religious association.
        Outer ring rotates slowly; inner sigil breathes.
      -->
      <svg class="sigil-svg" width="130" height="130" viewBox="0 0 130 130" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- slowly rotating outer ring with cardinal ticks -->
        <g class="sigil-ring-outer">
          <circle cx="65" cy="65" r="60" stroke="#d4956e" stroke-width="0.8" opacity="0.5"/>
          <circle cx="65" cy="65" r="53" stroke="#d4956e" stroke-width="0.5" stroke-dasharray="2 7" opacity="0.4"/>
          <g stroke="#d4956e" stroke-width="1" opacity="0.6">
            <line x1="65" y1="4"   x2="65" y2="13"/>
            <line x1="65" y1="117" x2="65" y2="126"/>
            <line x1="4"  y1="65"  x2="13" y2="65"/>
            <line x1="117" y1="65" x2="126" y2="65"/>
            <line x1="23" y1="23"  x2="30" y2="30"/>
            <line x1="100" y1="100" x2="107" y2="107"/>
            <line x1="107" y1="23" x2="100" y2="30"/>
            <line x1="23" y1="107" x2="30" y2="100"/>
          </g>
        </g>
        <!-- the Sulfur sigil: upward triangle + cross, breathing -->
        <g class="sigil-core">
          <!-- upward triangle = fire = will -->
          <path d="M65 22 L95 72 L35 72 Z" stroke="#e8c79c" stroke-width="1.8" stroke-linejoin="round"/>
          <!-- inner light fill -->
          <path d="M65 30 L90 68 L40 68 Z" fill="#d4956e" opacity="0.08"/>
          <!-- cross below = the four elements the will commands -->
          <line x1="65" y1="72" x2="65" y2="100" stroke="#e8c79c" stroke-width="1.8"/>
          <line x1="50" y1="86" x2="80" y2="86" stroke="#e8c79c" stroke-width="1.8"/>
          <!-- apex dot = the concentrated point of will -->
          <circle cx="65" cy="22" r="2.5" fill="#ffe8d4"/>
          <!-- center dot -->
          <circle cx="65" cy="58" r="2" fill="#e8c79c" opacity="0.6"/>
        </g>
      </svg>
    </div>

    <div class="dots-bg">
      <i style="width:5px;height:5px;left:44%;top:26%;animation-delay:0s;"></i>
      <i style="width:4px;height:4px;left:36%;top:66%;animation-delay:1.4s;"></i>
      <i style="width:3px;height:3px;left:28%;top:50%;animation-delay:.8s;"></i>
    </div>
  </div>

  <!-- ══ LEVEL PILL ══ -->
  <div class="level-row">
    <div class="level-pill">
      <div class="level-ring-mini">
        <svg viewBox="0 0 34 34">
          <circle cx="17" cy="17" r="14" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="2.2"/>
          <circle cx="17" cy="17" r="14" fill="none" stroke="#d4956e" stroke-width="2.2"
                  stroke-linecap="round" stroke-dasharray="88" stroke-dashoffset="31"/>
        </svg>
        <div class="lrm-num">7</div>
      </div>
      <div class="level-pill-text">
        <b>Adept</b>
        <span>Level 7</span>
      </div>
    </div>
  </div>

  <!-- ══ CONTROLS ══ -->
  <div class="controls">
    <div class="seg">
      <button class="active" onclick="setLevel('beginner',this)">Beginner</button>
      <button onclick="setLevel('advanced',this)">Advanced</button>
    </div>
    <button class="view-toggle" id="viewBtn" onclick="toggleView(this)" title="List view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/>
      </svg>
    </button>
  </div>

  <!-- ══ CARDS ══ -->
  <div class="scroll" id="cardsRoot"></div>
</div>

<script>
var ICONS = {
  clock:   '<svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="16" cy="16" r="12"/><path d="M16 9v7l5 3"/></svg>',
  thought: '<svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="16" cy="16" r="12"/><circle cx="16" cy="16" r="6"/><circle cx="16" cy="16" r="1.8" fill="currentColor" stroke="none"/></svg>',
  visual:  '<svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 16 Q16 5 29 16 Q16 27 3 16Z"/><circle cx="16" cy="16" r="4.5"/><circle cx="16" cy="16" r="1.4" fill="currentColor" stroke="none"/></svg>',
  auditory:'<svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="16" r="2.6" fill="currentColor" stroke="none"/><path d="M17 11 Q21 16 17 21"/><path d="M21 8 Q27 16 21 24"/></svg>',
  asana:   '<svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><circle cx="16" cy="8" r="3.5"/><path d="M16 13 L7 26 L25 26 Z"/></svg>',
  mirror:  '<svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><ellipse cx="16" cy="15" rx="8" ry="11"/><line x1="16" y1="26" x2="16" y2="30"/><line x1="12" y1="30" x2="20" y2="30"/></svg>'
};

var SETS = {
  beginner:[
    ['clock',   'Clock',          'Follow the seconds hand. Stop when focus breaks.'],
    ['thought', 'Thought Control','Hold one thought. Tap when the mind wanders.'],
    ['visual',  'Visualization',  'Hold a mental image with the eyes closed.'],
    ['auditory','Auditory',       'Sustain a single sound within the mind.'],
    ['asana',   'Asana',          'Sit in perfect stillness. Build the body of will.'],
    ['mirror',  'Soul Mirror',    'Reflect. Make one honest edit today.']
  ],
  advanced:[
    ['clock',   'Moving Clock',   'Hold the hand while walking. Will against motion.'],
    ['visual',  'Living Image',   'Animate the image. Hold it changing without losing it.'],
    ['auditory','Inner Voice',    'Compose a sustained phrase and hold its sound.'],
    ['thought', 'Vacancy',        'Empty the mind entirely. Tap at the first intrusion.']
  ]
};

var curLevel = 'beginner';

function cardHTML(ex, listMode) {
  var ico = ICONS[ex[0]] || ICONS.clock;
  var isMirror = ex[0] === 'mirror';
  if (listMode) {
    return '<div class="card ' + ex[0] + (isMirror ? ' full' : '') + '">'
      + '<div class="card-ico">' + ico + '</div>'
      + '<div class="lv-body"><div class="card-name">' + ex[1] + '</div><div class="card-desc">' + ex[2] + '</div></div></div>';
  }
  if (isMirror) {
    return '<div class="card mirror full"><div class="card-ico">' + ico + '</div>'
      + '<div class="lv-body"><div class="card-name">' + ex[1] + '</div><div class="card-desc">' + ex[2] + '</div></div></div>';
  }
  return '<div class="card ' + ex[0] + '">'
    + '<div class="card-ico">' + ico + '</div>'
    + '<div class="card-name">' + ex[1] + '</div>'
    + '<div class="card-desc">' + ex[2] + '</div></div>';
}

function render() {
  var set = SETS[curLevel];
  // grid view
  var gridHTML = '<div class="grid">' + set.map(function(e){ return cardHTML(e, false); }).join('') + '</div>';
  var dotsHTML = '<div class="cdots"><i class="on"></i><i></i></div>';
  // list view
  var listHTML = '<div class="listview">' + set.map(function(e){ return cardHTML(e, true); }).join('') + '</div>';
  document.getElementById('cardsRoot').innerHTML = gridHTML + dotsHTML + listHTML
    + '<div class="footnote">Each gate forges a faculty of the magician.</div>';
}

function setLevel(lv, btn) {
  curLevel = lv;
  document.querySelectorAll('.seg button').forEach(function(b){ b.classList.toggle('active', b === btn); });
  render();
}

function toggleView(btn) {
  document.getElementById('frame').classList.toggle('expanded');
  btn.classList.toggle('active');
}

render();
</script>
</body>
</html>
